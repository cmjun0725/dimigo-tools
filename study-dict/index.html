<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080d">
<link rel="dns-prefetch" href="https://openrouter.ai">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<title>모르는것 — 학습 사전</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
/* font loaded via <link> in <head> */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}



:root{
  --bg:#08080d;--surface:#12121c;--surface2:#1a1a2e;--surface3:#222238;
  --border:#2a2a45;--text:#f0f0f8;--text2:#8888a8;--text3:#555570;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,.4);
  --positive:#00cec9;--negative:#ff6b6b;--neutral:#a29bfe;--warning:#ffeaa7;
  --history:#ff6b6b;--science:#00cec9;--korean:#ffeaa7;--math:#74b9ff;
  --english:#fd79a8;--ethics:#a29bfe;--music:#fd79a8;--art:#e17055;--pe:#55efc4;
  --radius:16px;--radius-sm:10px;--shadow:0 8px 32px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f5f5fa;--surface:#fff;--surface2:#eeeef5;--surface3:#dddde8;
  --border:#ccc;--text:#222;--text2:#666;--text3:#999;
  --shadow:0 8px 32px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(108,92,231,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(0,206,201,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
[data-theme="light"] body::before{display:none}

.hdr{text-align:center;padding:48px 20px 24px;position:relative;z-index:1}
.hdr-top{display:flex;justify-content:space-between;align-items:center;max-width:700px;margin:0 auto 12px}
.hdr-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:6px 16px;font-size:12px;color:var(--text2)}
.logo{font-size:clamp(32px,7vw,48px);font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--positive));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-2px}
.logo-sub{font-size:14px;color:var(--text2);display:block;margin-top:4px;-webkit-text-fill-color:var(--text2)}
.subtitle{color:var(--text3);font-size:14px;margin-bottom:24px;font-weight:300}

.icon-btn{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:1.1em;display:flex;align-items:center;justify-content:center;transition:all .25s;position:relative}
.icon-btn:hover{border-color:var(--accent);color:var(--accent2);transform:translateY(-1px);box-shadow:0 2px 12px var(--accent-glow)}.icon-btn:active{transform:scale(0.92)!important;box-shadow:none}#themeBtn{background:linear-gradient(135deg,rgba(108,92,231,.15),rgba(0,206,201,.1))}#themeBtn:hover{background:linear-gradient(135deg,rgba(108,92,231,.25),rgba(0,206,201,.2))}

.sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(8px)}
.sov.active{display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.sbx{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:92%;max-width:400px;box-shadow:0 16px 64px rgba(0,0,0,.6);animation:slideUp .3s ease}
.sbx h2{font-size:1.1em;margin-bottom:16px;color:var(--accent2)}
.sbx label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;margin-top:12px}
.sbx input{width:100%;padding:10px 14px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:all .25s}
.sbx input:focus{border-color:var(--accent)}
.sbx .hint{font-size:11px;color:var(--text3);margin-top:4px}
.sbx .brow{display:flex;gap:8px;margin-top:18px}
.sbx button{flex:1;padding:10px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .2s}
.bcl{background:var(--surface2);color:var(--text2);border:1px solid var(--border)!important}
.bsv{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff}
#ks{margin-top:10px;padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;display:none}

.selpill{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:700px;margin:0 auto 16px;padding:0 20px;position:relative;z-index:1}
.spill{background:var(--surface);border:2px solid var(--border);border-radius:30px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .25s;font-family:inherit;display:flex;align-items:center;gap:5px}
.spill:hover{border-color:var(--accent);color:var(--accent2);transform:translateY(-1px)}
.spill.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
.spill .pe{font-size:14px}

.scon{max-width:640px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.sbox{position:relative;display:flex;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:60px;padding:4px 6px 4px 20px;transition:all .3s}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.sbox input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit;padding:12px 0}
.sbox input::placeholder{color:var(--text3)}
.sbtn{background:linear-gradient(135deg,var(--accent),#8b5cf6);border:none;border-radius:50px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;flex-shrink:0}
.sbtn:hover{transform:scale(1.05)}
.sbtn svg{width:18px;height:18px;fill:white}
.sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);z-index:100;display:none}
.sug.show{display:block;animation:fadeIn .15s ease}

.etag{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:4px}
.etag:hover{border-color:var(--accent);color:var(--accent2);background:rgba(108,92,231,.08)}

/* Stats Bar */
.stats-bar{max-width:720px;margin:16px auto 0;padding:0 20px;display:none;position:relative;z-index:1}
.stats-bar.show{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px;animation:fadeIn .2s ease}
.stat-chip .n{font-weight:700;color:var(--accent2)}

/* History */
.hist-bar{max-width:720px;margin:12px auto 0;padding:0 20px;display:none;position:relative;z-index:1}
.hist-bar.show{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hist-bar .hl{font-size:11px;color:var(--text3);margin-right:4px}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.hist-item:hover{border-color:var(--accent);color:var(--accent2)}
.hist-item .hx{color:var(--text3);margin-left:2px;cursor:pointer}
.hist-item .hx:hover{color:var(--negative)}

/* Timeline */
.tl-section{max-width:1100px;margin:28px auto 0;padding:0 16px;position:relative;z-index:1}
.tl-section.hidden{display:none}
.tl-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.tl-title{font-size:12px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.tl-ctrl{display:flex;gap:4px;align-items:center}
.tl-zb{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.tl-zb:hover{border-color:var(--accent);color:var(--accent2)}
.tl-zl{font-size:10px;color:var(--text3);min-width:40px;text-align:center;font-weight:600}
.tl-zb.rst{width:auto;padding:0 10px;font-size:10px}
.tl-outer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tl-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--accent) var(--surface2)}
.tl-scroll::-webkit-scrollbar{height:5px}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
.tl-canvas{position:relative;min-height:280px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.tl-seg{position:absolute;top:0;bottom:0}
.tl-seg-bg{position:absolute;inset:0;opacity:.06;border-right:1px solid var(--border)}
.tl-seg-name{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:800;white-space:nowrap;transition:all .3s}
.tl-seg-years{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text3);white-space:nowrap}
.tl-main-line{position:absolute;top:50%;left:0;right:0;height:3px;transform:translateY(-50%);border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent) 5%,var(--accent) 95%,transparent);opacity:.4}
.tl-mkr{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:5;transition:all .25s}
.tl-mkr:hover{transform:translate(-50%,-50%) scale(1.15);z-index:10}
.tl-mkr-dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--bg);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tl-mkr-dot.hl{animation:pulse 2s infinite;width:22px;height:22px;border-width:4px}
.tl-mkr-lbl{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:700;pointer-events:none}
.tl-mkr.above .tl-mkr-lbl{bottom:calc(100% + 8px)}
.tl-mkr.below .tl-mkr-lbl{top:calc(100% + 8px)}
.tl-ev{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:4;transition:all .25s}
.tl-ev:hover{transform:translate(-50%,-50%) scale(1.4);z-index:12}
.tl-ev-dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tl-ev-dot.hl{background:var(--accent)!important;box-shadow:0 0 12px var(--accent);width:12px;height:12px}
.tl-ev-lbl{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:600;pointer-events:none}
.tl-ev-tip{display:none;position:absolute;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:20;text-align:left;pointer-events:none}
.tl-ev:hover .tl-ev-tip{display:block;animation:fadeIn .15s ease}
.tl-ev-tip .tt-t{font-size:12px;font-weight:700;margin-bottom:3px}
.tl-ev-tip .tt-y{font-size:10px;color:var(--accent2);font-weight:600}
.tl-ev-tip .tt-d{font-size:10px;color:var(--text2);line-height:1.4;margin-top:2px}

/* Results */
.ra{max-width:720px;margin:28px auto;padding:0 20px;position:relative;z-index:1}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:16px;box-shadow:var(--shadow);animation:slideUp .4s ease;position:relative}
.rcard-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.rcard-term{font-size:clamp(22px,5vw,30px);font-weight:900;letter-spacing:-1px}
.rcard-field{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;color:white}
.f-역사{background:var(--history)}.f-과학{background:var(--science)}.f-국어{background:var(--korean);color:#333}
.f-수학{background:var(--math)}.f-영어{background:var(--english)}.f-도덕{background:var(--ethics)}
.f-음악{background:var(--music);color:#333}.f-미술{background:var(--art)}.f-체육{background:var(--pe);color:#333}
.rcard-reading{font-size:14px;color:var(--text2);margin-top:-10px;margin-bottom:16px;font-weight:300}
.rsec{margin-bottom:16px}.rsec:last-child{margin-bottom:0}
.rsec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.rsec-c{font-size:13px;line-height:1.8;color:var(--text)}.rsec-c strong{color:var(--accent2);font-weight:600}
.hbox{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin-top:4px}
.hchar{font-size:28px;font-weight:900;display:inline-block;margin-right:14px;color:var(--korean)}
.hmean{font-size:12px;color:var(--text2)}
.rtl{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-top:4px}
.rtl .era{font-size:14px;font-weight:700}.rtl .year{font-size:12px;color:var(--accent2);margin-left:6px}
.ai-load{display:flex;align-items:center;justify-content:center;gap:8px;padding:28px;color:var(--text2);font-size:13px}
.sp-sm{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.nf{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;box-shadow:var(--shadow);animation:slideUp .4s ease}
.nf .em{font-size:44px;margin-bottom:12px}
.nf h3{font-size:16px;margin-bottom:6px}.nf p{color:var(--text2);font-size:13px;line-height:1.7}
.bmark{position:absolute;top:12px;right:12px;background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.bmark:hover{border-color:var(--accent);transform:scale(1.1)}
.bmark.saved{background:rgba(108,92,231,.15);border-color:var(--accent);color:var(--accent2)}

/* Bookmarks */
.bm-section{max-width:720px;margin:20px auto;padding:0 20px;position:relative;z-index:1}
.bm-section.hidden{display:none}
.bm-title{font-size:12px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bm-grid{display:flex;gap:6px;flex-wrap:wrap}
.bm-chip{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.bm-chip:hover{border-color:var(--accent);color:var(--accent2)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 20px;font-size:13px;color:var(--text);box-shadow:var(--shadow);z-index:300;transition:transform .3s ease;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:600px){.hdr{padding:28px 16px 14px}.hdr-badge{font-size:10px;padding:4px 10px}.logo{font-size:28px!important;letter-spacing:-1px}.logo-sub{font-size:11px}.subtitle{font-size:12px;margin-bottom:16px}.icon-btn{width:44px;height:44px;font-size:18px;border-radius:12px}.hdr-top{gap:8px}.hdr-top>div:last-child{gap:8px}.selpill{gap:5px;padding:0 12px;margin-bottom:12px}.spill{padding:8px 12px;font-size:12px;font-weight:600;min-height:40px;display:flex;align-items:center}.spill:active{transform:scale(0.95);opacity:0.8}.scon{padding:0 14px}.sbox{padding:3px 5px 3px 16px;min-height:48px}.sbox input{font-size:16px;padding:12px 0}.sbtn{width:44px;height:44px;min-width:44px}.ra{padding:0 14px}.rcard{padding:18px;border-radius:12px}.rcard-term{font-size:22px!important}.rcard-reading{font-size:12px}.rsec{margin-bottom:14px}.rsec-lbl{font-size:10px;margin-bottom:4px}.rsec-c{font-size:12px;line-height:1.7}.hbox{padding:10px 14px}.hchar{font-size:22px;margin-right:10px}.hmean{font-size:11px}.bmark{width:36px;height:36px;font-size:16px;top:10px;right:10px}.bmark:active{transform:scale(0.9)}.etag{padding:6px 10px;font-size:11px;min-height:34px;display:inline-flex;align-items:center}.etag:active{transform:scale(0.95)}.stat-chip{padding:5px 10px;font-size:10px}.hist-item{padding:5px 10px;font-size:10px;min-height:30px;display:inline-flex;align-items:center}.bm-chip{padding:6px 10px;font-size:10px;min-height:32px;display:inline-flex;align-items:center}.bm-chip:active{transform:scale(0.95)}.nf{padding:24px 16px}.nf .em{font-size:36px}.nf h3{font-size:14px}.nf p{font-size:12px}.tl-hdr{flex-direction:column;gap:6px}.tl-zb{width:32px;height:32px;font-size:14px}.toast{font-size:12px;padding:8px 16px;bottom:80px}.sov .sbx{padding:20px;width:95%;max-width:none}.sov .sbx h2{font-size:14px}.sov .sbx input{font-size:16px;padding:12px;min-height:44px}.sov .sbx label{font-size:11px}.sov .sbx .brow{flex-direction:column;gap:8px}.sov .sbx button{padding:12px;min-height:44px;font-size:14px}.tl-ev-tip{display:none!important}}@media(max-width:380px){.spill{padding:6px 8px;font-size:11px}.logo{font-size:24px!important}.sbox input{font-size:14px}.rcard{padding:14px}.rcard-term{font-size:20px!important}}
/* Theme toggle tooltip on mobile */.theme-wrap{position:relative;display:flex;align-items:center;gap:4px}.theme-label{font-size:10px;color:var(--accent2);font-weight:600;display:none;white-space:nowrap}@media(max-width:600px){.theme-label{display:block;position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:9px;color:var(--accent2);pointer-events:none;animation:fadeIn .2s ease;white-space:nowrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}/* GPU compositing hints */.rcard,.bmark,.spill,.etag,.hist-item,.bm-chip,.icon-btn,.ab{will-change:auto}</style>

<body>
<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-badge">📚 중고등 학습 사전</div>
    <div style="display:flex;gap:6px">
      <div class="theme-wrap"><span class="theme-label" id="themeLabel">모드</span><button class="icon-btn" onclick="toggleTheme()" title="다크/라이트 모드" id="themeBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button></div>
      <button class="icon-btn" onclick="toggleSettings()" title="API 설정">&#9881;</button>
    </div>
  </div>
  <div style="position:relative;display:inline-block">

function renderTimeline(){var canvas=document.getElementById('timelineCanvas');canvas.querySelectorAll('.tl-seg,.tl-ev,.tl-mkr').forEach(function(e){e.remove()});var totalSpan=ERAS[ERAS.length-1].end-ERAS[0].start;var w=Math.max(canvas.clientWidth||1000,BASE_W*tlZoomLvl);canvas.style.width=w+'px';var PAD=30;var usableW=w-PAD*2;

  var h='<div class="rcard"><button class="bmark'+(bookmarks.indexOf(q)>=0?' saved':'')+'" data-bq="'+esc(q)+'">&#11088;</button>';
  h+='<div class="rcard-hdr"><span class="rcard-term">'+esc(item.name)+'</span><span class="rcard-field f-'+esc(item.field||'')+'">'+esc(item.field||'')+'</span>';
  if(item.difficulty){var dc=item.difficulty==='상'?'var(--negative)':item.difficulty==='중'?'var(--warning)':'var(--positive)';h+='<span style="font-size:10px;padding:3px 8px;border-radius:10px;background:'+dc+'22;color:'+dc+';font-weight:600">난이도: '+esc(item.difficulty)+'</span>'}
  if(item.grade)h+='<span style="font-size:10px;padding:3px 8px;border-radius:10px;background:var(--surface2);color:var(--text2)">&#128197; '+esc(item.grade)+'</span>';
  h+='</div>';
  if(item.reading)h+='<div class="rcard-reading">'+esc(item.reading)+'</div>';
  if(item.hanja&&item.hanja.length){h+='<div class="rsec"><div class="rsec-lbl"><span>&#128292;</span> 한자 풀이</div><div class="hbox">';item.hanja.forEach(function(j){h+='<div style="margin-bottom:4px"><span class="hchar">'+esc(j.char)+'</span><span class="hmean">'+esc(j.meaning)+'</span></div>'});h+='</div></div>'}
  h+='<div class="rsec"><div class="rsec-lbl"><span>&#128214;</span> 이것은 무엇인가?</div><div class="rsec-c" style="font-size:15px;line-height:2"><strong>'+esc(item.meaning)+'</strong></div></div>';
  if(item.description)h+='<div class="rsec"><div class="rsec-lbl"><span>&#128221;</span> 상세 설명</div><div class="rsec-c">'+esc(item.description)+'</div></div>';
  if(item.keyPoints&&item.keyPoints.length){h+='<div class="rsec"><div class="rsec-lbl"><span>&#11088;</span> 핵심 포인트</div><div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px">';item.keyPoints.forEach(function(p,i){h+='<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px"><span style="background:var(--accent);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">'+(i+1)+'</span><span style="font-size:13px;line-height:1.6">'+esc(p)+'</span></div>'});h+='</div></div>'}
  if(item.tlEra){h+='<div class="rsec"><div class="rsec-lbl"><span>&#128197;</span> 타임라인 위치</div><div class="rtl"><span class="era">'+esc(item.tlEra)+'</span>'+(item.tlYear?'<span class="year">· '+esc(item.tlYear)+'</span>':'')+'</div></div>'}
  if(item.commonMistakes&&item.commonMistakes.length){h+='<div class="rsec"><div class="rsec-lbl"><span>&#9888;</span> 자주 틀리는 오해</div><div style="background:rgba(255,107,107,.06);border:1px solid rgba(255,107,107,.15);border-radius:var(--radius-sm);padding:12px 16px">';item.commonMistakes.forEach(function(m){h+='<div style="display:flex;gap:6px;margin-bottom:4px"><span style="color:var(--negative)">&#10007;</span><span style="font-size:12px;color:var(--text2)">'+esc(m)+'</span></div>'});h+='</div></div>'}
  if(item.memoryTip)h+='<div class="rsec"><div class="rsec-lbl"><span>&#128161;</span> 이렇게 기억하세요!</div><div style="background:rgba(255,234,167,.06);border:1px solid rgba(255,234,167,.15);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;line-height:1.7">'+esc(item.memoryTip)+'</div></div>';
  if(item.relatedTopics&&item.relatedTopics.length){h+='<div class="rsec"><div class="rsec-lbl"><span>&#128279;</span> 함께 공부하면 좋은 것</div><div style="display:flex;flex-wrap:wrap;gap:6px">';item.relatedTopics.forEach(function(t){h+='<span style="background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:11px;color:var(--accent2)">'+esc(t)+'</span>'});h+='</div></div>'}
  if(item.importance)h+='<div class="rsec"><div class="rsec-lbl"><span>&#127891;</span> 왜 배우는가?</div><div class="rsec-c">'+esc(item.importance)+'</div></div>';
  if(item.realLife)h+='<div class="rsec"><div class="rsec-lbl"><span>&#127758;</span> 실생활 활용</div><div style="background:rgba(0,206,201,.06);border:1px solid rgba(0,206,201,.15);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;line-height:1.7">'+esc(item.realLife)+'</div></div>';
  if(item.funFact)h+='<div class="rsec"><div class="rsec-lbl"><span>&#127881;</span> 재미있는 사실</div><div style="background:rgba(162,155,254,.06);border:1px solid rgba(162,155,254,.15);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;line-height:1.7;color:var(--text2);font-style:italic">&#128161; '+esc(item.funFact)+'</div></div>';
  if(item.examTip)h+='<div class="rsec"><div class="rsec-lbl"><span>&#127919;</span> 시험 대비 꿀팁</div><div class="rsec-c" style="background:var(--surface2);padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--border)">'+esc(item.examTip)+'</div></div>';
  h+='</div>';return h}

// Stats
function showStats(q,item){var sb=document.getElementById('statsBar');sb.classList.add('show');sb.innerHTML='<div class="stat-chip">&#128270; "<span class="n">'+esc(q)+'</span>" 검색됨</div>';if(item.field)sb.innerHTML+='<div class="stat-chip">&#128218; <span class="n">'+esc(item.field)+'</span></div>';if(item.difficulty)sb.innerHTML+='<div class="stat-chip">&#127919; 난이도 <span class="n">'+esc(item.difficulty)+'</span></div>'}

// AI Search
window.aiSearch=async function(query){
  var key=API_CONFIG.openrouter;
  if(!key){ra.innerHTML='<div class="nf"><div class="em">&#128273;</div><h3>API 키가 필요합니다</h3><p>&#9881; 설정에서 OpenRouter API 키를 입력해주세요<br><a href="https://openrouter.ai/keys" style="color:var(--accent2)">openrouter.ai/keys</a>에서 무료 발급 가능</p></div>';return}
  ra.innerHTML='<div class="ai-load"><div class="sp-sm"></div>AI가 "'+esc(query)+'"를 분석하고 있습니다...</div>';
  try{
    var prompt='당신은 중고등학생을 위한 친절한 학습 선생님입니다. 아래 단어에 대해 학생이 이해하기 쉽게 설명해주세요.\n\n단어: '+query+'\n\nJSON으로만 응답. 필드: field, reading, meaning, description, keyPoints(배열3개이상), commonMistakes(배열2개이상), memoryTip, relatedTopics(배열2개이상), importance, examTip, realLife, funFact, difficulty(상중하), grade(학년학기), hanja(배열), tlEra, tlYear';
    var res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-4o-mini',messages:[{role:'system',content:'학습 사전 전문가. JSON으로만 응답. 한국어.'},{role:'user',content:prompt}],temperature:0.3,max_tokens:3000})});
    if(!res.ok){var err=await res.json().catch(function(){return{}});throw new Error(err&&err.error?err.error.message:'API 오류 ('+res.status+')')}
    var data=await res.json();var content=data.choices[0].message.content;
    var m=content.match(/\{[\s\S]*\}/);if(!m)throw new Error('JSON 파싱 실패');
    var ai=JSON.parse(m[0]);ai.name=query;
    highlightTerm=ai.tlEra?ai:null;
    
    showStats(query,ai);
    ra.innerHTML=renderAICard(ai,query);renderTimeline();
  }catch(e){ra.innerHTML='<div class="nf"><div class="em">&#10060;</div><h3>AI 분석 실패</h3><p>'+esc(e.message)+'</p></div>'}
};
renderTimeline();

document.getElementById('resultArea').addEventListener('click',function(e){var btn=e.target.closest('.bmark');if(btn){var q=btn.getAttribute('data-bq');if(q)toggleBookmark(q)}});

})();
</script>
