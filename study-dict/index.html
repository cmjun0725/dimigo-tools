<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모르는것 — 학습 사전</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap');
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 20px 4px var(--accent-glow)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

:root{
  --bg:#08080d;--surface:#12121c;--surface2:#1a1a2e;--surface3:#222238;
  --border:#2a2a45;--border-glow:rgba(108,92,231,.3);
  --text:#f0f0f8;--text2:#8888a8;--text3:#555570;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,.4);
  --positive:#00cec9;--negative:#ff6b6b;--neutral:#a29bfe;
  --history:#ff6b6b;--science:#00cec9;--korean:#ffeaa7;--math:#74b9ff;--english:#fd79a8;--ethics:#a29bfe;
  --radius:16px;--radius-sm:10px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --glass:rgba(18,18,28,.85);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 10%,rgba(108,92,231,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(0,206,201,.04) 0%,transparent 50%);pointer-events:none;z-index:0}

/* Header */
.header{text-align:center;padding:56px 20px 28px;position:relative;z-index:1}
.header-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:6px 16px;font-size:12px;color:var(--text2);margin-bottom:16px}
.logo{font-size:clamp(36px,8vw,52px);font-weight:900;background:linear-gradient(135deg,var(--accent2) 0%,var(--positive) 50%,var(--info) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-2px}
.logo-sub{font-size:15px;font-weight:400;color:var(--text2);display:block;margin-top:4px;letter-spacing:0;-webkit-text-fill-color:var(--text2)}
.subtitle{color:var(--text3);font-size:14px;margin-bottom:28px;font-weight:300}

/* Settings */
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(8px)}
.settings-overlay.active{display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.settings-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:92%;max-width:440px;box-shadow:0 16px 64px rgba(0,0,0,.6);animation:slideUp .3s ease}
.settings-box h2{font-size:1.2em;margin-bottom:20px;color:var(--accent2);font-weight:700}
.settings-box label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;margin-top:16px}
.settings-box input{width:100%;padding:12px 16px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:all .25s}
.settings-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.settings-box .hint{font-size:11px;color:var(--text3);margin-top:5px}
.settings-box .btn-row{display:flex;gap:10px;margin-top:22px}
.settings-box button{flex:1;padding:11px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:all .2s}
.btn-close{background:var(--surface2);color:var(--text2);border:1px solid var(--border)!important}
.btn-close:hover{background:var(--border)}
.btn-save{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff}
.btn-save:hover{box-shadow:0 4px 16px var(--accent-glow);transform:translateY(-1px)}
#settingsStatus{margin-top:14px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;display:none}
#settingsStatus.ok{display:block;background:rgba(0,206,201,.08);color:var(--positive);border:1px solid rgba(0,206,201,.2)}

/* Subject selector */
.subject-selector{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:700px;margin:0 auto 20px;padding:0 20px;position:relative;z-index:1}
.subject-pill{background:var(--surface);border:2px solid var(--border);border-radius:30px;padding:9px 18px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .25s;font-family:inherit;display:flex;align-items:center;gap:7px;position:relative;overflow:hidden}
.subject-pill::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);transition:left .4s}
.subject-pill:hover::before{left:100%}
.subject-pill:hover{border-color:var(--accent);color:var(--accent2);transform:translateY(-1px)}
.subject-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
.subject-pill .pe{font-size:16px}
.subject-pill .pc{font-size:10px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px;font-weight:700}

/* Search */
.search-container{max-width:640px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.search-box{position:relative;display:flex;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:60px;padding:4px 6px 4px 24px;transition:all .3s ease}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit;padding:14px 0;font-weight:400}
.search-box input::placeholder{color:var(--text3);font-weight:300}
.search-btn{background:linear-gradient(135deg,var(--accent),#8b5cf6);border:none;border-radius:50px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,box-shadow .2s;flex-shrink:0}
.search-btn:hover{transform:scale(1.05);box-shadow:0 4px 16px var(--accent-glow)}
.search-btn svg{width:20px;height:20px;fill:white}
.suggestions{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);z-index:100;display:none}
.suggestions.show{display:block;animation:fadeIn .15s ease}
.suggestion-item{padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
.suggestion-item:hover{background:var(--surface2)}
.suggestion-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.suggestion-name{font-size:14px;font-weight:500}

/* Quick tags */
.quick-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:640px;margin:20px auto 0;padding:0 20px;position:relative;z-index:1}
.quick-tag{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500}
.quick-tag:hover{border-color:var(--accent);color:var(--accent2);background:rgba(108,92,231,.08)}

/* Timeline */
.timeline-section{max-width:900px;margin:36px auto 0;padding:0 20px;position:relative;z-index:1}
.timeline-section.hidden{display:none}
.timeline-title{font-size:13px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.timeline-controls{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.tl-z-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.tl-z-btn:hover{border-color:var(--accent);color:var(--accent2)}
.tl-z-label{font-size:11px;color:var(--text3);min-width:50px;text-align:center}
.timeline-wrap{position:relative;overflow-x:auto;overflow-y:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px 20px;scrollbar-width:thin;scrollbar-color:var(--accent) var(--surface2)}
.timeline-wrap::-webkit-scrollbar{height:6px}
.timeline-wrap::-webkit-scrollbar-track{background:var(--surface2);border-radius:3px}
.timeline-wrap::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
.timeline-track{position:relative;min-height:220px;transition:width .3s ease}
.timeline-line{position:absolute;top:50%;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--border) 0%,var(--accent) 20%,var(--accent) 80%,var(--border) 100%);transform:translateY(-50%);border-radius:2px;opacity:.6}
.timeline-era{position:absolute;top:50%;transform:translate(-50%,-50%);text-align:center;cursor:pointer;transition:all .25s;padding:4px 2px}
.timeline-era:hover{transform:translate(-50%,-50%) scale(1.08);z-index:5}
.tl-era-dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--bg);position:absolute;left:50%;transform:translateX(-50%);z-index:2;transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tl-era-dot.hl{animation:pulse 2s infinite;width:20px;height:20px}
.tl-era-label{font-size:11px;font-weight:700;white-space:nowrap;transition:color .2s}
.tl-era-years{font-size:9px;color:var(--text3);white-space:nowrap;margin-top:12px}
.timeline-event{position:absolute;cursor:pointer;transition:all .25s;z-index:4}
.timeline-event:hover{transform:translate(-50%,-50%) scale(1.3);z-index:10}
.tl-ev-dot{width:10px;height:10px;border-radius:50%;background:var(--history);border:2px solid var(--surface);transition:all .3s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tl-ev-dot.hl{background:var(--accent);box-shadow:0 0 16px var(--accent);width:14px;height:14px;border-width:3px}
.tl-ev-label{font-size:9px;color:var(--text2);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;text-align:center;margin:4px auto 0;font-weight:500}
.tl-ev-tip{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:20;text-align:left}
.timeline-event:hover .tl-ev-tip{display:block;animation:fadeIn .15s ease}
.tl-ev-tip .tt-t{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--text)}
.tl-ev-tip .tt-y{font-size:11px;color:var(--accent2);margin-bottom:4px;font-weight:600}
.tl-ev-tip .tt-d{font-size:11px;color:var(--text2);line-height:1.5}

/* Results */
.result-area{max-width:720px;margin:36px auto;padding:0 20px;position:relative;z-index:1}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:20px;box-shadow:var(--shadow);animation:slideUp .4s ease}
.result-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.result-term{font-size:clamp(24px,5vw,34px);font-weight:900;letter-spacing:-1px}
.result-field{font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;color:white;letter-spacing:.5px}
.field-역사{background:var(--history)}
.field-과학{background:var(--science)}
.field-국어{background:var(--korean);color:#333}
.field-수학{background:var(--math)}
.field-영어{background:var(--english)}
.field-도덕{background:var(--ethics)}
.result-reading{font-size:15px;color:var(--text2);margin-top:-12px;margin-bottom:20px;font-weight:300}
.result-section{margin-bottom:18px}
.result-section:last-child{margin-bottom:0}
.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.section-label .icon{font-size:14px}
.section-content{font-size:14px;line-height:1.8;color:var(--text)}
.section-content strong{color:var(--accent2);font-weight:600}
.hanja-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 20px;margin-top:6px}
.hanja-char{font-size:30px;font-weight:900;display:inline-block;margin-right:16px;color:var(--korean)}
.hanja-meaning{font-size:13px;color:var(--text2)}
.not-found-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px;text-align:center;box-shadow:var(--shadow);animation:slideUp .4s ease}
.not-found-card .emoji{font-size:48px;margin-bottom:16px}
.not-found-card h3{font-size:18px;margin-bottom:8px;font-weight:700}
.not-found-card p{color:var(--text2);font-size:14px;line-height:1.7}
.tip-list{text-align:left;margin-top:18px;padding:16px 20px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.tip-list h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--accent2)}
.tip-list li{font-size:12px;color:var(--text2);margin-bottom:5px;margin-left:14px;line-height:1.6}
.stats-bar{max-width:720px;margin:0 auto 14px;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
.stats-text{font-size:13px;color:var(--text2)}
.filter-btn{font-size:12px;padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;font-weight:500;transition:all .2s}
.filter-btn:hover{border-color:var(--accent);color:var(--accent2);background:rgba(108,92,231,.08)}

/* AI Loading */
.ai-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:32px;color:var(--text2);font-size:14px}
.ai-loading .spinner-sm{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}

/* Result inline timeline */
.result-tl{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin-top:6px}
.result-tl .era{font-size:15px;font-weight:700;color:var(--text)}
.result-tl .year{font-size:13px;color:var(--accent2);margin-left:8px}

/* Responsive */
@media(max-width:600px){.header{padding:40px 20px 20px}.result-card{padding:24px 20px}.subject-pill{padding:7px 12px;font-size:12px}.timeline-event .tl-ev-tip{display:none!important}}
</style>
</head>
<body>
<div class="header">
  <div class="header-badge">📚 중고등 학습 사전</div>
  <div style="position:relative;display:inline-block">
    <div class="logo">모르는것<span class="logo-sub">중고등 학습 사전</span></div>
    <button onclick="toggleSettings()" style="position:absolute;top:-8px;right:-48px;background:var(--surface);border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1em;display:flex;align-items:center;justify-content:center;transition:all .25s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent2)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text2)'">⚙️</button>
  </div>
  <p class="subtitle">모르는 단어를 검색하면 분야별로 꼼꼼하게 알려드립니다</p>
</div>

<div class="subject-selector" id="subjectSelector">
  <button class="subject-pill active" data-field="all"><span class="pe">🌐</span>전체<span class="pc" id="countAll"></span></button>
  <button class="subject-pill" data-field="역사"><span class="pe">📜</span>역사<span class="pc" id="count역사"></span></button>
  <button class="subject-pill" data-field="과학"><span class="pe">🔬</span>과학<span class="pc" id="count과학"></span></button>
  <button class="subject-pill" data-field="국어"><span class="pe">📖</span>국어<span class="pc" id="count국어"></span></button>
  <button class="subject-pill" data-field="수학"><span class="pe">📐</span>수학<span class="pc" id="count수학"></span></button>
  <button class="subject-pill" data-field="영어"><span class="pe">🌍</span>영어<span class="pc" id="count영어"></span></button>
  <button class="subject-pill" data-field="도덕"><span class="pe">⚖️</span>도덕<span class="pc" id="count도덕"></span></button>
</div>

<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)toggleSettings()">
  <div class="settings-box">
    <h2>⚙️ AI 설정</h2>
    <label>🔑 관리자 비밀번호</label>
    <input type="password" id="adminPw" placeholder="비밀번호를 입력하세요" autocomplete="off">
    <label>🤖 OpenAI API 키</label>
    <input type="password" id="oaiKeyInput" placeholder="sk-or-..." autocomplete="off">
    <div class="hint">서버에 영구 저장 — 모든 사용자가 공용으로 사용합니다</div>
    <div id="keyStatus" style="margin-top:12px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;display:none"></div>
    <div id="settingsStatus"></div>
    <div class="btn-row">
      <button class="btn-close" onclick="toggleSettings()">닫기</button>
      <button class="btn-save" onclick="saveSettings()">💾 저장</button>
    </div>
  </div>
</div>

<div class="search-container">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (예: 진대법, 뷰렛반응)" autocomplete="off">
    <button class="search-btn" id="searchBtn"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
  </div>
  <div class="suggestions" id="suggestions"></div>
</div>

<div class="quick-tags" id="quickTags"></div>

<div class="timeline-section" id="timelineSection">
  <div class="timeline-title"><span>📅</span> 한국사 타임라인 <span style="font-size:10px;font-weight:400;color:var(--text3)">(Ctrl+휠 확대)</span></div>
  <div class="timeline-controls">
    <button class="tl-z-btn" onclick="tlZoom(-1)">−</button>
    <span class="tl-z-label" id="tlZoomLabel">100%</span>
    <button class="tl-z-btn" onclick="tlZoom(1)">+</button>
    <button class="tl-z-btn" onclick="tlResetZoom()" style="width:auto;padding:0 10px;font-size:11px">리셋</button>
  </div>
  <div class="timeline-wrap" id="timelineWrap">
    <div class="timeline-track" id="timelineTrack"><div class="timeline-line"></div></div>
  </div>
</div>

<div class="stats-bar" id="statsBar" style="display:none;"></div>
<div class="result-area" id="resultArea"></div>

<script>
var KB=[
{name:"진대법",field:"역사",reading:"진대법(賑貸法)",hanja:[{char:"賑",meaning:"구휼할 진 - 어려운 사람을 구제하다"},{char:"貸",meaning:"빌릴 대 - 빌려주다"},{char:"法",meaning:"법 법 - 제도"}],meaning:"신라가 기근이 든 백성들에게 국가 곡식을 빌려주고, 해가 풀린 뒤 갚게 한 구휼 제도.",description:"진대법은 신라가 기근이나 재해로 고통받는 백성들에게 국가가 보관하고 있던 곡식을 빌려주고, 다음 해에 원수로 갚게 하거나 이자를 붙여 갚게 한 구휼 제도입니다. 흥덕왕 3년(838년)에 처음 실시되었다고 기록되어 있습니다.",importance:"신라가 백성의 생활을 보살폈다는 증거이며, 이후 고려/조선시대의 의창, 상평창 등 곡식 비축 제도로 이어졌습니다. 국사 시험에서 신라의 사회/경제 정책을 다룰 때 자주 출제됩니다.",tlEra:"통일신라",tlYear:"838년",examTip:"신라의 사회 정책, 구휼 제도로 자주 출제. 진대법=신라+곡식 빌려주기로 기억!"},

{name:"삼강행실도",field:"역사",reading:"삼강행실도(三綱行實圖)",hanja:[{char:"三",meaning:"셋 삼"},{char:"綱",meaning:"벼리 강"},{char:"行",meaning:"행할 행"},{char:"實",meaning:"실 실"},{char:"圖",meaning:"그림 도"}],meaning:"유교적 삼강의 도덕을 그림과 글로 설명한 조선시대 교양서.",description:"세종 16년(1434년)에 편찬된 것으로, 왕과 신하, 아버지와 아들, 남편과 아내라는 유교의 3대 도덕 규범을 본보기와 그림으로 설명한 책입니다.",importance:"조선시대의 유교 통치 이념과 백성 교육을 보여주는 대표 자료입니다.",tlEra:"조선시대",tlYear:"1434년",examTip:"세종의 문화 사업으로 자주 출제. 성리학 + 유교 통치 이념과 연결."},

var m=pool.filter(function(i){return i.name.toLowerCase().indexOf(q)!==-1||i.meaning.toLowerCase().indexOf(q)!==-1||(i.reading&&i.reading.toLowerCase().indexOf(q)!==-1)}).slice(0,6);

function searchByField(f){
  var items=f?KB.filter(function(i){return i.field===f}):KB;
  document.getElementById('timelineSection').classList.toggle('hidden',!f||f!=='역사');renderTimeline();
  sb.style.display='flex';
  sb.innerHTML='<span class="stats-text">'+(f||'전체')+' — '+items.length+'개 용어</span><div><button class="filter-btn" id="backBtn">← 뒤로</button></div>';
  document.getElementById('backBtn').addEventListener('click',resetSearch);
  ra.innerHTML=items.map(renderCard).join('')}

function resetSearch(){var tl=document.getElementById('timelineSection');if(currentField==='역사'||currentField==='all')tl.classList.remove('hidden');else tl.classList.add('hidden');sb.style.display='none';ra.innerHTML='';si.value='';highlightTerm=null;renderTimeline()}

function doSearch(){
  var q=si.value.trim();if(!q)return;highlightTerm=null;
  var pool=currentField==='all'?KB:KB.filter(function(i){return i.field===currentField});
  var m=pool.filter(function(i){return i.name.toLowerCase().indexOf(q.toLowerCase())!==-1||i.meaning.toLowerCase().indexOf(q.toLowerCase())!==-1||(i.reading&&i.reading.toLowerCase().indexOf(q.toLowerCase())!==-1)});
  se.classList.remove('show');
  if(!m.length){
    ra.innerHTML='<div class="not-found-card"><div class="emoji">🔍</div><h3>"'+esc(q)+'"에 대한 결과가 없습니다</h3><p>현재 '+KB.length+'개의 학습 용어가 등록되어 있습니다.</p><div class="tip-list"><h4>💡 검색 팁</h4><ul><li>단어를 정확하게 입력해주세요</li><li>비슷한 말로 검색해보세요</li><li>과목을 선택하면 해당 분야만 검색됩니다</li></ul></div></div>';
    if(getOaiKey())ra.innerHTML+='<div style="text-align:center;margin-top:16px"><button onclick="aiSearch(\''+esc(q).replace(/'/g,"\\'")+'\')" style="padding:12px 24px;background:linear-gradient(135deg,var(--accent),#8b5cf6);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">🤖 AI에게 물어보기</button></div>';
    renderTimeline();return}
  if(m[0].tlEra){highlightTerm=m[0];document.getElementById('timelineSection').classList.remove('hidden');}
  ra.innerHTML=m.map(renderCard).join('');renderTimeline()}

function renderCard(item){
var h='<div class="result-card"><div class="result-header"><span class="result-term">'+esc(item.name)+'</span><span class="result-field field-'+item.field+'">'+item.field+'</span></div>';

if(item.hanja&&item.hanja.length){h+='<div class="result-section"><div class="section-label"><span class="icon">🔤</span> 한자 풀이</div><div class="hanja-box">';item.hanja.forEach(function(j){h+='<div style="margin-bottom:6px"><span class="hanja-char">'+j.char+'</span><span class="hanja-meaning">'+esc(j.meaning)+'</span></div>'});h+='</div></div>'}
h+='<div class="result-section"><div class="section-label"><span class="icon">📖</span> '+(item.field==='역사'?'의미':'이것은 무엇인가?')+'</div><div class="section-content"><strong>'+esc(item.meaning)+'</strong></div></div>';
h+='<div class="result-section"><div class="section-label"><span class="icon">📝</span> 상세 설명</div><div class="section-content">'+esc(item.description)+'</div></div>';
if(item.tlEra){h+='<div class="result-section"><div class="section-label"><span class="icon">📅</span> 타임라인 위치</div><div class="result-tl"><span class="era">'+esc(item.tlEra)+'</span>'+(item.tlYear?'<span class="year">· '+esc(item.tlYear)+'</span>':'')+'</div></div>'}
if(item.practicalUse)h+='<div class="result-section"><div class="section-label"><span class="icon">🔧</span> 실무 활용</div><div class="section-content">'+esc(item.practicalUse)+'</div></div>';
h+='<div class="result-section"><div class="section-label"><span class="icon">⭐</span> 왜 배우는가?</div><div class="section-content">'+esc(item.importance)+'</div></div>';
if(item.examTip)h+='<div class="result-section"><div class="section-label"><span class="icon">🎯</span> 시험 대비 꿀팁</div><div class="section-content" style="background:var(--surface2);padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--border)">'+esc(item.examTip)+'</div></div>';
return h+'</div>'}

// Timeline
function renderTimeline(){
  var track=document.getElementById('timelineTrack'),tw=TL_BASE*tlZoomLvl;
  track.style.width=tw+'px';document.getElementById('tlZoomLabel').textContent=Math.round(tlZoomLvl*100)+'%';
  track.querySelectorAll('.timeline-era,.timeline-event').forEach(function(e){e.remove()});
  var pad=40,usable=tw-pad*2,segW=usable/TL_ERAS.length;
  TL_ERAS.forEach(function(era,i){
    var cx=pad+i*segW+segW/2,el=document.createElement('div');
    el.className='timeline-era';el.style.left=cx+'px';el.style.width=segW+'px';
    var hl=highlightTerm&&highlightTerm.tlEra&&era.name.indexOf(highlightTerm.tlEra)!==-1;
    var above=i%2===0;
    var dot='<div class="tl-era-dot'+(hl?' hl':'')+'" style="background:'+(hl?'var(--accent)':era.color)+(hl?';box-shadow:0 0 12px var(--accent)':'')+(above?';bottom:-7px':';top:-7px')+'"></div>';
    var lbl='<div class="tl-era-label" style="color:'+(hl?'var(--accent2)':'var(--text2)')+(above?'':'margin-top:12px;margin-bottom:0')+'">'+esc(era.name)+'</div>';
    var yrs='<div class="tl-era-years">'+era.start.toLocaleString()+'~'+era.end+'</div>';
    el.innerHTML=above?lbl+yrs+dot:dot+lbl+yrs;
    el.addEventListener('click',function(){si.value=era.name;doSearch();ra.scrollIntoView({behavior:'smooth',block:'start'})});
    track.appendChild(el)});
  TL_EVENTS.forEach(function(ev){
    var eIdx=TL_ERAS.findIndex(function(e){return e.id===ev.era});if(eIdx<0)return;
    var era=TL_ERAS[eIdx],eStart=pad+eIdx*segW;
    var frac=(ev.year-era.start)/Math.max(era.end-era.start,1),x=eStart+frac*segW;
    var el=document.createElement('div');el.className='timeline-event';
    el.style.cssText='left:'+x+'px;top:50%;transform:translate(-50%,-50%);position:absolute';
    var hl=highlightTerm&&highlightTerm.tlYear&&ev.name.indexOf(highlightTerm.name)!==-1;
    el.innerHTML='<div class="tl-ev-dot'+(hl?' hl':'')+'"></div><div class="tl-ev-label">'+esc(ev.name)+'</div><div class="tl-ev-tip"><div class="tt-t">'+esc(ev.name)+'</div><div class="tt-y">'+ev.year.toLocaleString()+'년</div><div class="tt-d">'+esc(ev.desc)+'</div></div>';
    el.addEventListener('click',function(){si.value=ev.name;doSearch();ra.scrollIntoView({behavior:'smooth',block:'start'})});
    track.appendChild(el)});
  if(highlightTerm){
    var eIdx=TL_ERAS.findIndex(function(e){return highlightTerm.tlEra&&e.name.indexOf(highlightTerm.tlEra)!==-1});
    if(eIdx>=0){var x=pad+eIdx*segW+segW/2;document.getElementById('timelineWrap').scrollTo({left:Math.max(0,x-document.getElementById('timelineWrap').clientWidth/2),behavior:'smooth'})}}}

window.tlZoom=function(d){tlZoomLvl=d>0?Math.min(tlZoomLvl*1.3,5):Math.max(tlZoomLvl/1.3,0.5);renderTimeline()};
window.tlResetZoom=function(){tlZoomLvl=1;renderTimeline();document.getElementById('timelineWrap').scrollTo({left:0,behavior:'smooth'})};
document.getElementById('timelineWrap').addEventListener('wheel',function(e){if(e.ctrlKey||e.metaKey){e.preventDefault();e.deltaY<0?tlZoom(1):tlZoom(-1)}},{passive:false});

if(item.reading)h+='<div class="result-reading">'+esc(item.reading)+'</div>';
if(item.hanja&&item.hanja.length){h+='<div class="result-section"><div class="section-label"><span class="icon">🔤</span> 한자 풀이</div><div class="hanja-box">';item.hanja.forEach(function(j){h+='<div style="margin-bottom:6px"><span class="hanja-char">'+j.char+'</span><span class="hanja-meaning">'+esc(j.meaning)+'</span></div>'});h+='</div></div>'}
h+='<div class="result-section"><div class="section-label"><span class="icon">📖</span> 이것은 무엇인가?</div><div class="section-content" style="font-size:16px;line-height:2"><strong>'+esc(item.meaning)+'</strong></div></div>';
if(item.description)h+='<div class="result-section"><div class="section-label"><span class="icon">📝</span> 상세 설명</div><div class="section-content">'+esc(item.description)+'</div></div>';
if(item.keyPoints&&item.keyPoints.length){h+='<div class="result-section"><div class="section-label"><span class="icon">⭐</span> 핵심 포인트</div><div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px">';item.keyPoints.forEach(function(p,i){h+='<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px"><span style="background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">'+(i+1)+'</span><span style="font-size:14px;line-height:1.6;color:var(--text)">'+esc(p)+'</span></div>'});h+='</div></div>'}
if(item.tlEra){h+='<div class="result-section"><div class="section-label"><span class="icon">📅</span> 타임라인 위치</div><div class="result-tl"><span class="era">'+esc(item.tlEra)+'</span>'+(item.tlYear?'<span class="year">· '+esc(item.tlYear)+'</span>':'')+'</div></div>'}
if(item.commonMistakes&&item.commonMistakes.length){h+='<div class="result-section"><div class="section-label"><span class="icon">⚠️</span> 자주 틀리는 오해</div><div style="background:rgba(255,107,107,.06);border:1px solid rgba(255,107,107,.15);border-radius:var(--radius-sm);padding:14px 18px">';item.commonMistakes.forEach(function(m){h+='<div style="display:flex;gap:8px;margin-bottom:6px"><span style="color:var(--negative)">✗</span><span style="font-size:13px;color:var(--text2)">'+esc(m)+'</span></div>'});h+='</div></div>'}
if(item.memoryTip){h+='<div class="result-section"><div class="section-label"><span class="icon">💡</span> 이렇게 기억하세요!</div><div style="background:rgba(255,234,167,.06);border:1px solid rgba(255,234,167,.15);border-radius:var(--radius-sm);padding:14px 18px;font-size:14px;line-height:1.7">'+esc(item.memoryTip)+'</div></div>'}
if(item.relatedTopics&&item.relatedTopics.length){h+='<div class="result-section"><div class="section-label"><span class="icon">🔗</span> 함께 공부하면 좋은 것</div><div style="display:flex;flex-wrap:wrap;gap:8px">';item.relatedTopics.forEach(function(t){h+='<span style="background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--accent2)">'+esc(t)+'</span>'});h+='</div></div>'}
if(item.importance)h+='<div class="result-section"><div class="section-label"><span class="icon">🎓</span> 왜 배우는가?</div><div class="section-content">'+esc(item.importance)+'</div></div>';
if(item.realLife){h+='<div class="result-section"><div class="section-label"><span class="icon">🌍</span> 실생활 활용</div><div style="background:rgba(0,206,201,.06);border:1px solid rgba(0,206,201,.15);border-radius:var(--radius-sm);padding:14px 18px;font-size:14px;line-height:1.7">'+esc(item.realLife)+'</div></div>'}
if(item.funFact){h+='<div class="result-section"><div class="section-label"><span class="icon">🎉</span> 재미있는 사실</div><div style="background:rgba(162,155,254,.06);border:1px solid rgba(162,155,254,.15);border-radius:var(--radius-sm);padding:14px 18px;font-size:14px;line-height:1.7;color:var(--text2);font-style:italic">💡 '+esc(item.funFact)+'</div></div>'}
if(item.examTip)h+='<div class="result-section"><div class="section-label"><span class="icon">🎯</span> 시험 대비 꿀팁</div><div class="section-content" style="background:var(--surface2);padding:14px 18px;border-radius:var(--radius-sm);font-size:14px;border:1px solid var(--border)">'+esc(item.examTip)+'</div></div>';
h+='</div>';return h}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

window.toggleSettings=async function(){var ov=document.getElementById("settingsOverlay");ov.classList.toggle("active");if(ov.classList.contains("active")){document.getElementById("adminPw").value="";try{var d={oaiSet:!!localStorage.getItem('oaiKey'),oaiPreview:(localStorage.getItem('oaiKey')||'').substring(0,8)+'...'};var s=document.getElementById("keyStatus");s.style.display="block";if(d.oaiSet){s.textContent="현재 상태: OpenAI ✅ "+d.oaiPreview;s.style.background="rgba(0,206,201,.08)";s.style.color="var(--positive)";s.style.border="1px solid rgba(0,206,201,.2)"}else{s.textContent="OpenAI API 키가 설정되지 않았습니다.";s.style.background="rgba(255,107,107,.08)";s.style.color="var(--negative)";s.style.border="1px solid rgba(255,107,107,.2)"}}catch(e){}}};
window.saveSettings=async function(){
  var pw=document.getElementById("adminPw").value.trim();
  var oaiVal=document.getElementById("oaiKeyInput").value.trim();
  
  if(!oaiVal){showKS("OpenAI API 키를 입력해주세요.","err");return}
  if(!oaiVal.startsWith("sk-or-")&&!oaiVal.startsWith("sk-")){showKS("API 키는 sk-로 시작해야 합니다.","err");return}
  if(oaiVal.length<10){showKS("API 키가 너무 짧습니다. 올바른 키를 입력하세요.","err");return}
  try{
    localStorage.setItem('oaiKey',oaiVal);
    var data=await res.json();
    if(!res.ok)throw new Error(data.error||"저장 실패");
    showKS("✅ "+data.message,"ok");
    setTimeout(function(){toggleSettings()},1500);
  }catch(e){showKS("❌ "+e.message,"err")}
};
function showKS(msg,type){var s=document.getElementById("keyStatus");s.textContent=msg;s.style.display="block";if(type==="ok"){s.style.background="rgba(0,206,201,.08)";s.style.color="var(--positive)";s.style.border="1px solid rgba(0,206,201,.2)"}else{s.style.background="rgba(255,107,107,.08)";s.style.color="var(--negative)";s.style.border="1px solid rgba(255,107,107,.2)"}}
async function getOaiKey(){try{var d={oaiSet:!!localStorage.getItem('oaiKey'),oaiPreview:(localStorage.getItem('oaiKey')||'').substring(0,8)+'...'};return d.oaiSet?"yes":""}catch(e){return""}}

window.aiSearch=async function(query){
  var key=await getOaiKey();if(!key){alert('관리자가 API 키를 설정해야 합니다.');return}
  ra.innerHTML='<div class="ai-loading"><div class="spinner-sm"></div>AI가 "'+esc(query)+'"를 분석하고 있습니다...</div>';
  try{
    var prompt='당신은 중고등학생을 위한 친절한 학습 선생님입니다. 아래 단어에 대해 학생이 이해하기 쉽게 설명해주세요.\n\n단어: '+query+'\n\nJSON으로만 응답. 필드: field, reading, meaning, description, keyPoints(배열3개이상), commonMistakes(배열2개이상), memoryTip, relatedTopics(배열2개이상), importance, examTip, realLife, funFact, difficulty(상중하), grade(학년학기), hanja(배열), tlEra, tlYear';
    var apiKey=localStorage.getItem('oaiKey')||'';
    var res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'openai/gpt-4o-mini',messages:[{role:'system',content:'학습 사전 전문가. JSON으로만 응답. 한국어.'},{role:'user',content:prompt}],temperature:0.3,max_tokens:3000})});
    if(!res.ok){var err=await res.json().catch(function(){return{}});throw new Error(err?.error?.message||'API 오류')}
    var data=await res.json(),content=data.choices[0].message.content,jsonMatch=content.match(/\{[\s\S]*\}/);
    if(!jsonMatch)throw new Error('JSON 파싱 실패');
    var ai=JSON.parse(jsonMatch[0]);ai.name=query;
    highlightTerm=ai.tlEra?ai:null;if(ai.tlEra)document.getElementById('timelineSection').classList.remove('hidden');
    ra.innerHTML=renderAICard(ai);renderTimeline();
  }catch(e){ra.innerHTML='<div class="not-found-card"><div class="emoji">❌</div><h3>AI 분석 실패</h3><p>'+esc(e.message)+'</p></div>'}};;

renderTimeline();
})();
</script>
