<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모르는것 — 학습 사전</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap');
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 24px 6px var(--accent-glow)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
:root{
  --bg:#08080d;--surface:#12121c;--surface2:#1a1a2e;--surface3:#222238;
  --border:#2a2a45;--border-glow:rgba(108,92,231,.3);
  --text:#f0f0f8;--text2:#8888a8;--text3:#555570;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,.4);
  --positive:#00cec9;--negative:#ff6b6b;--neutral:#a29bfe;--warning:#ffeaa7;
  --history:#ff6b6b;--science:#00cec9;--korean:#ffeaa7;--math:#74b9ff;
  --english:#fd79a8;--ethics:#a29bfe;--music:#fd79a8;--art:#e17055;--pe:#55efc4;
  --radius:16px;--radius-sm:10px;--shadow:0 8px 32px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(108,92,231,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(0,206,201,.04) 0%,transparent 50%);pointer-events:none;z-index:0}

.header{text-align:center;padding:56px 20px 28px;position:relative;z-index:1}
.header-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:6px 16px;font-size:12px;color:var(--text2);margin-bottom:16px}
.logo{font-size:clamp(36px,8vw,52px);font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--positive));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-2px}
.logo-sub{font-size:15px;font-weight:400;color:var(--text2);display:block;margin-top:4px;-webkit-text-fill-color:var(--text2)}
.subtitle{color:var(--text3);font-size:14px;margin-bottom:28px;font-weight:300}

.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(8px)}
.settings-overlay.active{display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.settings-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:92%;max-width:440px;box-shadow:0 16px 64px rgba(0,0,0,.6);animation:slideUp .3s ease}
.settings-box h2{font-size:1.2em;margin-bottom:20px;color:var(--accent2);font-weight:700}
.settings-box label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;margin-top:16px}
.settings-box input{width:100%;padding:12px 16px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:all .25s}
.settings-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.settings-box .hint{font-size:11px;color:var(--text3);margin-top:5px}
.settings-box .btn-row{display:flex;gap:10px;margin-top:22px}
.settings-box button{flex:1;padding:11px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:all .2s}
.btn-close{background:var(--surface2);color:var(--text2);border:1px solid var(--border)!important}
.btn-save{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff}
#keyStatus{margin-top:12px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;display:none}

.subject-selector{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:700px;margin:0 auto 20px;padding:0 20px;position:relative;z-index:1}
.subject-pill{background:var(--surface);border:2px solid var(--border);border-radius:30px;padding:9px 18px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .25s;font-family:inherit;display:flex;align-items:center;gap:7px}
.subject-pill:hover{border-color:var(--accent);color:var(--accent2);transform:translateY(-1px)}
.subject-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
.subject-pill .pe{font-size:16px}

.search-container{max-width:640px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.search-box{position:relative;display:flex;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:60px;padding:4px 6px 4px 24px;transition:all .3s}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit;padding:14px 0}
.search-box input::placeholder{color:var(--text3);font-weight:300}
.search-btn{background:linear-gradient(135deg,var(--accent),#8b5cf6);border:none;border-radius:50px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;flex-shrink:0}
.search-btn:hover{transform:scale(1.05)}
.search-btn svg{width:20px;height:20px;fill:white}
.suggestions{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);z-index:100;display:none}
.suggestions.show{display:block;animation:fadeIn .15s ease}
.suggestion-item{padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
.suggestion-item:hover{background:var(--surface2)}
.suggestion-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}

.example-tag{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:5px}
.example-tag:hover{border-color:var(--accent);color:var(--accent2);background:rgba(108,92,231,.08)}

/* === 타임라인 === */
.timeline-section{max-width:1100px;margin:36px auto 0;padding:0 16px;position:relative;z-index:1}
.timeline-section.hidden{display:none}
.tl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.timeline-title{font-size:13px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.tl-controls{display:flex;gap:6px;align-items:center}
.tl-z-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.tl-z-btn:hover{border-color:var(--accent);color:var(--accent2);background:rgba(108,92,231,.08)}
.tl-z-label{font-size:11px;color:var(--text3);min-width:48px;text-align:center;font-weight:600}
.tl-z-btn.reset{width:auto;padding:0 12px;font-size:11px;font-weight:600}
.tl-hint{font-size:10px;color:var(--text3);font-weight:400}
.timeline-outer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.timeline-scroll{overflow-x:auto;overflow-y:hidden;padding:0;scrollbar-width:thin;scrollbar-color:var(--accent) var(--surface2);position:relative}
.timeline-scroll::-webkit-scrollbar{height:6px}
.timeline-scroll::-webkit-scrollbar-track{background:var(--surface2)}
.timeline-scroll::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
.timeline-canvas{position:relative;min-height:300px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* 시대 세그먼트 */
.tl-seg{position:absolute;top:0;bottom:0;transition:opacity .3s}
.tl-seg-bg{position:absolute;inset:0;opacity:.08;border-right:1px solid var(--border)}
.tl-seg-name{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;white-space:nowrap;transition:all .3s;letter-spacing:.5px}
.tl-seg-years{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text3);white-space:nowrap;font-weight:400}

/* 메인 타임라인 라인 */
.tl-main-line{position:absolute;top:50%;left:0;right:0;height:4px;transform:translateY(-50%);border-radius:2px;background:linear-gradient(90deg,transparent 0%,var(--accent) 5%,var(--accent) 95%,transparent 100%);opacity:.5}

/* 시대 마커 (라인 위/아래) */
.tl-marker{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:5;transition:all .25s}
.tl-marker:hover{transform:translate(-50%,-50%) scale(1.15);z-index:10}
.tl-marker-dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--bg);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:all .3s;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.tl-marker-dot.hl{animation:pulse 2s infinite;width:24px;height:24px;border-width:4px}
.tl-marker-label{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:700;transition:all .3s;pointer-events:none}
.tl-marker.above .tl-marker-label{bottom:calc(100% + 10px)}
.tl-marker.below .tl-marker-label{top:calc(100% + 10px)}
.tl-marker-sub{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:var(--text3);transition:all .3s;pointer-events:none}
.tl-marker.above .tl-marker-sub{bottom:calc(100% + 28px)}
.tl-marker.below .tl-marker-sub{top:calc(100% + 28px)}

/* 이벤트 마커 */
.tl-ev{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:4;transition:all .25s}
.tl-ev:hover{transform:translate(-50%,-50%) scale(1.4);z-index:12}
.tl-ev-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:all .3s}
.tl-ev-dot.hl{background:var(--accent)!important;box-shadow:0 0 16px var(--accent);width:14px;height:14px;border-width:3px}
.tl-ev-line{position:absolute;left:50%;width:1px;background:var(--border);transform:translateX(-50%);transition:all .3s}
.tl-ev-label{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:600;transition:all .3s;pointer-events:none}
.tl-ev-year{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:700;transition:all .3s;pointer-events:none}
.tl-ev-desc{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:var(--text3);transition:all .3s;pointer-events:none;max-width:200px;overflow:hidden;text-overflow:ellipsis}

/* 이벤트 툴팁 (호버) */
.tl-ev-tip{display:none;position:absolute;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:20;text-align:left;pointer-events:none}
.tl-ev:hover .tl-ev-tip{display:block;animation:fadeIn .15s ease}
.tl-ev-tip .tt-t{font-size:13px;font-weight:700;margin-bottom:4px}
.tl-ev-tip .tt-y{font-size:11px;color:var(--accent2);margin-bottom:4px;font-weight:600}
.tl-ev-tip .tt-d{font-size:11px;color:var(--text2);line-height:1.5}

/* 결과 */
.result-area{max-width:720px;margin:36px auto;padding:0 20px;position:relative;z-index:1}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:20px;box-shadow:var(--shadow);animation:slideUp .4s ease}
.result-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.result-term{font-size:clamp(24px,5vw,34px);font-weight:900;letter-spacing:-1px}
.result-field{font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;color:white}
.field-역사{background:var(--history)}.field-과학{background:var(--science)}.field-국어{background:var(--korean);color:#333}
.field-수학{background:var(--math)}.field-영어{background:var(--english)}.field-도덕{background:var(--ethics)}
.field-음악{background:var(--music);color:#333}.field-미술{background:var(--art)}.field-체육{background:var(--pe);color:#333}
.result-reading{font-size:15px;color:var(--text2);margin-top:-12px;margin-bottom:20px;font-weight:300}
.result-section{margin-bottom:18px}.result-section:last-child{margin-bottom:0}
.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.section-content{font-size:14px;line-height:1.8;color:var(--text)}.section-content strong{color:var(--accent2);font-weight:600}
.hanja-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 20px;margin-top:6px}
.hanja-char{font-size:30px;font-weight:900;display:inline-block;margin-right:16px;color:var(--korean)}
.hanja-meaning{font-size:13px;color:var(--text2)}
.result-tl{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin-top:6px}
.result-tl .era{font-size:15px;font-weight:700}.result-tl .year{font-size:13px;color:var(--accent2);margin-left:8px}
.ai-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:32px;color:var(--text2);font-size:14px}
.spinner-sm{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.not-found-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px;text-align:center;box-shadow:var(--shadow);animation:slideUp .4s ease}
.not-found-card .emoji{font-size:48px;margin-bottom:16px}
.not-found-card h3{font-size:18px;margin-bottom:8px}.not-found-card p{color:var(--text2);font-size:14px;line-height:1.7}

@media(max-width:600px){.header{padding:40px 20px 20px}.result-card{padding:24px 20px}.subject-pill{padding:7px 12px;font-size:12px}.tl-ev-tip{display:none!important}.tl-seg-name{font-size:11px}.tl-marker-label{font-size:11px!important}.tl-ev-label{font-size:9px!important}}
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">📚 중고등 학습 사전</div>
  <div style="position:relative;display:inline-block">
    <div class="logo">모르는것<span class="logo-sub">중고등 학습 사전</span></div>
    <button onclick="toggleSettings()" style="position:absolute;top:-8px;right:-48px;background:var(--surface);border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1em;display:flex;align-items:center;justify-content:center;transition:all .25s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">⚙️</button>
  </div>
  <p class="subtitle">모르는 단어를 검색하면 AI가 분야별로 꼼꼼하게 알려드립니다</p>
</div>

<div class="subject-selector" id="subjectSelector">
  <button class="subject-pill active" data-field="all"><span class="pe">🌐</span>전체</button>
  <button class="subject-pill" data-field="역사"><span class="pe">📜</span>역사</button>
  <button class="subject-pill" data-field="과학"><span class="pe">🔬</span>과학</button>
  <button class="subject-pill" data-field="국어"><span class="pe">📖</span>국어</button>
  <button class="subject-pill" data-field="수학"><span class="pe">📐</span>수학</button>
  <button class="subject-pill" data-field="영어"><span class="pe">🌍</span>영어</button>
  <button class="subject-pill" data-field="도덕"><span class="pe">⚖️</span>도덕</button>
  <button class="subject-pill" data-field="음악"><span class="pe">🎵</span>음악</button>
  <button class="subject-pill" data-field="미술"><span class="pe">🎨</span>미술</button>
  <button class="subject-pill" data-field="체육"><span class="pe">🏃</span>체육</button>
</div>

<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)toggleSettings()">
  <div class="settings-box">
    <h2>⚙️ AI 설정</h2>
    <label>🤖 OpenRouter API 키</label>
    <input type="password" id="oaiKeyInput" placeholder="sk-or-..." autocomplete="off">
    <div class="hint">OpenRouter에서 발급 (openrouter.ai/keys)</div>
    <div id="keyStatus"></div>
    <div class="btn-row">
      <button class="btn-close" onclick="toggleSettings()">닫기</button>
      <button class="btn-save" onclick="saveSettings()">💾 저장</button>
    </div>
  </div>
</div>

<div class="search-container">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (예: 진대법, 뷰렛반응)" autocomplete="off">
    <button class="search-btn" id="searchBtn"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
  </div>
  <div class="suggestions" id="suggestions"></div>
</div>

<div id="welcomeSection" style="text-align:center;padding:30px 20px;margin-top:10px;position:relative;z-index:1">
  <div style="font-size:2em;margin-bottom:12px">🔍</div>
  <h3 style="font-size:16px;font-weight:600;margin-bottom:8px;color:var(--text2)">검색어를 입력하면 AI가 즉시 분석합니다</h3>
  <p style="font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:16px">과목을 선택하거나, 아래 추천 검색어를 클릭해보세요</p>
  <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center" id="exampleTags"></div>
</div>

<div class="timeline-section hidden" id="timelineSection">
  <div class="tl-header">
    <div class="timeline-title"><span>📅</span> 한국사 타임라인 <span class="tl-hint">마우스 휠로 확대/축소</span></div>
    <div class="tl-controls">
      <button class="tl-z-btn" onclick="tlZoom(-1)">−</button>
      <span class="tl-z-label" id="tlZoomLabel">100%</span>
      <button class="tl-z-btn" onclick="tlZoom(1)">+</button>
      <button class="tl-z-btn reset" onclick="tlResetZoom()">초기화</button>
    </div>
  </div>
  <div class="timeline-outer">
    <div class="timeline-scroll" id="timelineScroll">
      <div class="timeline-canvas" id="timelineCanvas">
        <div class="tl-main-line"></div>
      </div>
    </div>
  </div>
</div>

<div class="result-area" id="resultArea"></div>

<script>
(function(){
// ===== 한국사 데이터 =====
var ERAS=[
  {id:'stone',name:'구석기',color:'#7f8c8d',start:-500000,end:-8000,short:'旧石器'},
  {id:'neo',name:'신석기',color:'#9b59b6',start:-8000,end:-2333,short:'新石器'},
  {id:'gojoseon',name:'고조선',color:'#e67e22',start:-2333,end:-108,short:'古朝鮮'},
  {id:'samhan',name:'삼한',color:'#f39c12',start:-300,end:57,short:'三韓'},
  {id:'goguryeo',name:'고구려',color:'#e74c3c',start:-18,end:668,short:'高句麗'},
  {id:'baekje',name:'백제',color:'#3498db',start:-18,end:660,short:'百濟'},
  {id:'silla',name:'신라',color:'#f1c40f',start:-57,end:935,short:'新羅'},
  {id:'unified',name:'통일신라',color:'#9b59b6',start:676,end:935,short:'統一新羅'},
  {id:'goryeo',name:'고려',color:'#1abc9c',start:918,end:1392,short:'高麗'},
  {id:'joseon',name:'조선',color:'#3498db',start:1392,end:1897,short:'朝鮮'},

// ===== 타임라인 렌더링 =====
function renderTimeline(){
  var canvas=document.getElementById('timelineCanvas');
  // 기존 마커 제거
  canvas.querySelectorAll('.tl-seg,.tl-ev,.tl-marker').forEach(function(e){e.remove()});

  var totalSpan=ERAS[ERAS.length-1].end-ERAS[0].start;
  var w=Math.max(canvas.clientWidth||1000, BASE_W*tlZoomLvl);
  canvas.style.width=w+'px';

  var PAD=40;
  var usableW=w-PAD*2;

  // === 시대 세그먼트 ===
  ERAS.forEach(function(era){
    var x1=PAD+((era.start-ERAS[0].start)/totalSpan)*usableW;
    var x2=PAD+((era.end-ERAS[0].start)/totalSpan)*usableW;
    var segW=x2-x1;

    var seg=document.createElement('div');seg.className='tl-seg';
    seg.style.left=x1+'px';seg.style.width=segW+'px';

    var bg=document.createElement('div');bg.className='tl-seg-bg';bg.style.background=era.color;
    seg.appendChild(bg);

    var isHL=highlightTerm&&highlightTerm.tlEra&&era.name.indexOf(highlightTerm.tlEra)!==-1;

    // 시대 이름 (확대 수준에 따라 크기 조절)
    var nameEl=document.createElement('div');nameEl.className='tl-seg-name';
    nameEl.style.color=isHL?era.color:'var(--text2)';
    if(isHL){nameEl.style.textShadow='0 0 12px '+era.color+'88'}
    var nameSize=Math.max(11,Math.min(15,10+tlZoomLvl*2));
    nameEl.style.fontSize=nameSize+'px';
    nameEl.textContent=tlZoomLvl>=1.5?era.name:era.short||era.name;
    seg.appendChild(nameEl);

    // 연도 (확대 시에만 표시)
    if(tlZoomLvl>=1.2){
      var yearEl=document.createElement('div');yearEl.className='tl-seg-years';
      yearEl.textContent=era.start.toLocaleString()+' ~ '+era.end.toLocaleString();
      yearEl.style.opacity=Math.min(1,(tlZoomLvl-1.2)/0.8);
      seg.appendChild(yearEl);
    }

    // 시대 마커 (라인 위/아래 번갈아)
    var marker=document.createElement('div');marker.className='tl-marker '+(ERAS.indexOf(era)%2===0?'above':'below');
    marker.style.left=(x1+segW/2)+'px';
    var dot=document.createElement('div');dot.className='tl-marker-dot'+(isHL?' hl':'');
    dot.style.background=era.color;marker.appendChild(dot);

    // 마커 라벨 (확대 수준에 따라 표시)
    if(tlZoomLvl>=1){
      var lbl=document.createElement('div');lbl.className='tl-marker-label';
      var lblSize=Math.max(10,Math.min(14,9+tlZoomLvl*1.5));
      lbl.style.fontSize=lblSize+'px';
      lbl.style.color=isHL?era.color:'var(--text3)';
      lbl.textContent=era.name;
      marker.appendChild(lbl);
    }

    canvas.appendChild(seg);canvas.appendChild(marker);
  });

  // === 이벤트 마커 ===
  var evPositions=[]; // 충돌 방지용

  EVENTS.forEach(function(ev){
    var x=PAD+((ev.year-ERAS[0].start)/totalSpan)*usableW;
    var eraIdx=ERAS.findIndex(function(e){return e.id===ev.era});
    if(eraIdx<0)return;

    // 줌 레벨별 표시 필터링
    if(tlZoomLvl<1.2&&ERAS.length>5)return; // 100%일 때는 큰 이벤트만
    if(tlZoomLvl<1.5&&Math.abs(ev.year)>1000&&Math.abs(ev.year)<500)return; // 중간 이벤트
    if(tlZoomLvl<2&&ev.name.length>8)return; // 이름 긴 이벤트

    var above=eraIdx%2===0;
    var el=document.createElement('div');el.className='tl-ev';
    el.style.left=x+'px';

    var isEvHL=highlightTerm&&highlightTerm.tlEra&&(ev.name===highlightTerm||ev.name.indexOf(highlightTerm)!==-1);

    // 이벤트 점
    var dot=document.createElement('div');dot.className='tl-ev-dot'+(isEvHL?' hl':'');
    dot.style.background=ERAS[eraIdx]?(isEvHL?'var(--accent)':ERAS[eraIdx].color):'var(--history)';
    el.appendChild(dot);

    // 연결선 (확대 시)
    if(tlZoomLvl>=1.5){
      var line=document.createElement('div');line.className='tl-ev-line';
      line.style.top=above?'-30px':'10px';
      line.style.height='20px';
      line.style.opacity=Math.min(1,(tlZoomLvl-1.5)/1);
      el.appendChild(line);
    }

    // 이벤트 라벨 (확대 수준에 따라)
    if(tlZoomLvl>=1.5){
      var labelY=above?-36:36;
      // 충돌 방지: 같은 x 좌표 근처에 라벨이 있으면 위치 조정
      var adjusted=false;
      for(var i=0;i<evPositions.length;i++){
        if(Math.abs(evPositions[i].x-x)<40&&evPositions[i].above===above){
          labelY+=above?-18:18;adjusted=true;
        }
      }
      evPositions.push({x:x,above:above,y:labelY});

      var lbl=document.createElement('div');lbl.className='tl-ev-label';
      lbl.style.top=(labelY<0?labelY:labelY)+'px';
      lbl.style.fontSize=Math.max(10,Math.min(13,9+tlZoomLvl))+'px';
      lbl.style.color=isEvHL?'var(--accent2)':'var(--text2)';
      lbl.textContent=ev.name;
      el.appendChild(lbl);

      // 연도 (확대 시에만)
      if(tlZoomLvl>=2){
        var yr=document.createElement('div');yr.className='tl-ev-year';
        yr.style.top=(labelY+(above?-14:16))+'px';
        yr.style.color=ERAS[eraIdx]?ERAS[eraIdx].color:'var(--text3)';
        yr.textContent=ev.year.toLocaleString()+'년';
        el.appendChild(yr);
      }

      // 설명 (매우 확대 시)
      if(tlZoomLvl>=3&&ev.desc){
        var desc=document.createElement('div');desc.className='tl-ev-desc';
        desc.style.top=(labelY+(above?-28:30))+'px';
        desc.textContent=ev.desc;
        el.appendChild(desc);
      }
    }

    // 툴팁
    var tip=document.createElement('div');tip.className='tl-ev-tip';
    tip.style.bottom=above?'calc(100% + 40px)':'auto';
    tip.style.top=above?'auto':'calc(100% + 40px)';
    tip.innerHTML='<div class="tt-t">'+esc(ev.name)+'</div><div class="tt-y">'+ev.year.toLocaleString()+'년</div><div class="tt-d">'+esc(ev.desc)+'</div>';
    el.appendChild(tip);

    canvas.appendChild(el);
  });

  // 하이라이트된 시대로 자동 스크롤
  if(highlightTerm&&highlightTerm.tlEra){
    var hlEraIdx=ERAS.findIndex(function(e){return highlightTerm.tlEra&&e.name.indexOf(highlightTerm.tlEra)!==-1});
    if(hlEraIdx>=0){
      var hlX=PAD+((ERAS[hlEraIdx].start-ERAS[0].start)/totalSpan)*usableW;
      var hlX2=PAD+((ERAS[hlEraIdx].end-ERAS[0].start)/totalSpan)*usableW;
      var scrollTo=hlX+(hlX2-hlX)/2-(document.getElementById('timelineScroll').clientWidth/2);
      document.getElementById('timelineScroll').scrollTo({left:Math.max(0,scrollTo),behavior:'smooth'});
    }
  }
}

};

};

},{passive:false});

window.aiSearch=async function(query){
  var key=localStorage.getItem('oaiKey');
  if(!key){ra.innerHTML='<div class="not-found-card"><div class="emoji">🔑</div><h3>API 키가 필요합니다</h3><p>⚙️ 설정에서 OpenRouter API 키를 입력해주세요<br><a href="https://openrouter.ai/keys" style="color:var(--accent2)">openrouter.ai/keys</a>에서 무료 발급 가능</p></div>';return}
  ra.innerHTML='<div class="ai-loading"><div class="spinner-sm"></div>AI가 "'+esc(query)+'"를 분석하고 있습니다...</div>';
  try{
    var prompt='당신은 중고등학생을 위한 친절한 학습 선생님입니다. 아래 단어에 대해 학생이 이해하기 쉽게 설명해주세요.\n\n단어: '+query+'\n\nJSON으로만 응답. 필드: field, reading, meaning, description, keyPoints(배열3개이상), commonMistakes(배열2개이상), memoryTip, relatedTopics(배열2개이상), importance, examTip, realLife, funFact, difficulty(상중하), grade(학년학기), hanja(배열), tlEra, tlYear';
    var res=await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'openai/gpt-4o-mini',messages:[{role:'system',content:'학습 사전 전문가. JSON으로만 응답. 한국어.'},{role:'user',content:prompt}],temperature:0.3,max_tokens:3000})
    });
    if(!res.ok){var err=await res.json().catch(function(){return{}});throw new Error(err&&err.error?err.error.message:'API 오류 ('+res.status+')')}
    var data=await res.json();var content=data.choices[0].message.content;
    var jsonMatch=content.match(/\{[\s\S]*\}/);if(!jsonMatch)throw new Error('JSON 파싱 실패');
    var ai=JSON.parse(jsonMatch[0]);ai.name=query;
    highlightTerm=ai.tlEra?ai:null;
    if(ai.tlEra)document.getElementById('timelineSection').classList.remove('hidden');
    ra.innerHTML=renderAICard(ai);renderTimeline();
  }catch(e){
    ra.innerHTML='<div class="not-found-card"><div class="emoji">❌</div><h3>AI 분석 실패</h3><p>'+esc(e.message)+'</p><p style="margin-top:10px;font-size:12px;color:var(--text3)">API 키를 확인하거나 다시 시도해주세요</p></div>';
  }
};

renderTimeline();
})();
</script>
</body>
</html>
