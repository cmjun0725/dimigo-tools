<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080d">
<link rel="dns-prefetch" href="https://openrouter.ai">
<link rel="dns-prefetch" href="https://www.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<title>댓글 분석기</title>
<style>
/* font loaded via <link> in <head> */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
:root{--bg:#08080d;--sf:#12121c;--sf2:#1a1a2e;--sf3:#222238;--bd:#2a2a45;--tx:#f0f0f8;--tx2:#8888a8;--tx3:#555570;--ac:#6c5ce7;--ac2:#a29bfe;--acg:rgba(108,92,231,.4);--pos:#00cec9;--neg:#ff6b6b;--neu:#a29bfe;--info:#74b9ff;--warn:#ffeaa7;--r:16px;--rs:10px;--sh:0 8px 32px rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(108,92,231,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(0,206,201,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
.ct{max-width:860px;margin:0 auto;padding:20px;position:relative;z-index:1}
.hdr{text-align:center;padding:40px 0 28px}
.hdr-badge{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:30px;padding:5px 14px;font-size:11px;color:var(--tx2);margin-bottom:12px}
.hdr-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--pos);animation:pulse 2s infinite}
.hdr h1{font-size:clamp(1.6em,5vw,2.2em);font-weight:900;background:linear-gradient(135deg,var(--ac2),var(--pos),var(--info));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hdr p{color:var(--tx2);font-size:14px;font-weight:300}
.hdr-btns{position:absolute;top:40px;right:0;display:flex;gap:6px}
.ib{background:var(--sf);border:1px solid var(--bd);color:var(--tx2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .25s}
.ib:hover{border-color:var(--ac);color:var(--ac2)}
.sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(8px)}
.sov.active{display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.sbx{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:28px;width:92%;max-width:420px;box-shadow:0 16px 64px rgba(0,0,0,.6);animation:slideUp .3s ease}
.sbx h2{font-size:1.1em;margin-bottom:16px;color:var(--ac2)}
.sbx label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:5px;margin-top:12px}
.sbx input{width:100%;padding:10px 14px;background:var(--bg);border:2px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:all .25s}
.sbx input:focus{border-color:var(--ac)}
.sbx .hint{font-size:10px;color:var(--tx3);margin-top:3px}
.sbx .brow{display:flex;gap:8px;margin-top:16px}
.sbx button{flex:1;padding:10px;border:none;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .2s}
.bcl{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)!important}
.bsv{background:linear-gradient(135deg,var(--ac),#8b5cf6);color:#fff}
#ks{margin-top:10px;padding:8px 12px;border-radius:var(--rs);font-size:11px;display:none}
.is{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh);animation:slideUp .4s ease}
.ir{display:flex;gap:8px}
.ir input{flex:1;padding:12px 16px;background:var(--bg);border:2px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-size:14px;font-family:inherit;outline:none;transition:all .25s}
.ir input:focus{border-color:var(--ac)}
.ir input::placeholder{color:var(--tx3)}
.ab{padding:12px 24px;background:linear-gradient(135deg,var(--ac),#8b5cf6);border:none;border-radius:var(--rs);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .25s;white-space:nowrap}
.ab:hover{box-shadow:0 4px 16px var(--acg);transform:translateY(-1px)}
.ab:disabled{opacity:.5;cursor:not-allowed;transform:none}
.ah{text-align:center;margin-top:8px;font-size:11px;color:var(--tx3)}
.em{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:var(--rs);padding:12px 16px;color:var(--neg);font-size:13px;margin-bottom:16px;display:none}
.em.active{display:block}
.ld{display:none;text-align:center;padding:40px 20px;animation:fadeIn .3s ease}
.ld.active{display:block}
.ld .sp{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
.ld p{color:var(--tx2);font-size:13px}
.ld .pg{width:180px;height:3px;background:var(--sf2);border-radius:2px;margin:10px auto 0;overflow:hidden}
.ld .pb{height:100%;background:linear-gradient(90deg,var(--ac),var(--pos));border-radius:2px;transition:width .5s;width:0%}
/* Tree */
.tree{padding:16px 0;animation:slideUp .4s ease}
.troot{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;text-align:center;box-shadow:var(--sh)}
.troot img{width:100%;max-width:420px;height:auto;border-radius:8px;margin-bottom:12px;border:1px solid var(--bd)}
.troot .rt{font-size:16px;font-weight:900;margin-bottom:4px}
.troot .rch{font-size:12px;color:var(--tx2)}
.troot .rs{display:flex;justify-content:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.troot .rs span{font-size:11px;color:var(--tx3)}
.troot .rs .n{color:var(--ac2);font-weight:700}
.troot .rsum{margin-top:10px;font-size:12px;color:var(--tx2);line-height:1.7;max-width:560px;margin-left:auto;margin-right:auto}
.troot .rins{margin-top:8px;padding:8px 12px;background:rgba(108,92,231,.06);border:1px solid rgba(108,92,231,.15);border-radius:var(--rs);font-size:11px;color:var(--ac2);line-height:1.5}
.ttrunk{width:3px;height:32px;background:linear-gradient(180deg,var(--ac),var(--ac2));margin:0 auto;border-radius:2px;opacity:.4}
.tbranches{display:flex;justify-content:center;gap:0;flex-wrap:wrap;position:relative;padding-top:8px}
.tbranches::before{content:'';position:absolute;top:0;left:50%;width:80%;height:2px;background:linear-gradient(90deg,transparent,var(--ac),transparent);transform:translateX(-50%);opacity:.25}
.tbranch{flex:1;min-width:180px;max-width:260px;position:relative;padding:0 6px;margin-bottom:16px}
.bstem{width:2px;height:24px;margin:0 auto;border-radius:2px;opacity:.35}
.bnode{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:14px;cursor:pointer;transition:all .3s;position:relative}
.bnode:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.bnode.open{border-color:var(--ac)}
.bdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 6px currentColor}
.bname{font-size:13px;font-weight:700;display:inline}
.bcnt{font-size:10px;color:var(--tx3);margin-left:6px}
.bsum{font-size:10px;color:var(--tx3);margin-top:4px;line-height:1.4}
.barr{position:absolute;top:14px;right:12px;font-size:10px;color:var(--tx3);transition:transform .25s}
.bnode.open .barr{transform:rotate(180deg)}
.bleaves{display:none;padding:0 6px;margin-top:6px}
.bleaves.open{display:block}
.bsub{margin-bottom:4px}
.bsn{font-size:11px;font-weight:600;color:var(--tx2);padding:5px 8px;background:var(--sf2);border-radius:5px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.bsn:hover{background:var(--sf3);color:var(--tx)}
.bsn .sa{font-size:8px;transition:transform .2s;margin-left:auto}
.bsn.open .sa{transform:rotate(90deg)}
.bsc{display:none;padding:4px 0 4px 14px}
.bsc.open{display:block}
.lc{padding:6px 8px;font-size:11px;color:var(--tx2);line-height:1.5;border-left:2px solid var(--bd);margin-bottom:3px}
.lc .la{font-weight:600;color:var(--tx3);font-size:9px}
.cl{margin-top:20px}
.cl-title{font-size:13px;font-weight:700;color:var(--ac2);margin-bottom:8px}
.cl-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12px;line-height:1.5}
.cl-item:last-child{border-bottom:none}
.cl-idx{color:var(--ac2);font-weight:700;min-width:20px;flex-shrink:0}
.cl-text{color:var(--tx);flex:1}
.cl-meta{font-size:10px;color:var(--tx3);margin-top:2px}
.tstats{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.tst{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px 12px;font-size:11px;color:var(--tx2)}
.tst .n{font-weight:700;color:var(--ac2)}
@media(max-width:600px){.ct{padding:14px}.hdr{padding:28px 0 16px}.hdr-badge{font-size:10px;padding:4px 10px}.hdr h1{font-size:1.5em}.hdr p{font-size:12px}.ib{width:40px;height:40px;font-size:16px}.is{padding:14px}.ir{flex-direction:column;gap:10px}.ir input{width:100%;min-height:48px;font-size:16px;padding:14px}.ab{width:100%;min-height:48px;font-size:15px;padding:14px}.ab:active{transform:scale(0.97)}.ah{font-size:10px}.em{font-size:12px;padding:10px 14px}.ld{padding:28px 16px}.ld .sp{width:32px;height:32px}.ld p{font-size:12px}.tree{padding:12px 0}.troot{padding:14px;border-radius:12px}.troot img{max-width:100%}.troot .rt{font-size:14px}.troot .rch{font-size:11px}.troot .rs{gap:8px}.troot .rs span{font-size:10px}.troot .rsum{font-size:11px}.troot .rins{font-size:10px;padding:6px 10px}.ttrunk{height:24px}.tbranches{flex-direction:column;align-items:center}.tbranch{min-width:100%;max-width:100%;padding:0 4px;margin-bottom:10px}.bstem{height:16px}.bnode{padding:12px;border-radius:10px;min-height:44px}.bnode:active{transform:scale(0.97)}.bname{font-size:12px}.bcnt{font-size:9px}.bsum{font-size:9px}.bsub{margin-bottom:3px}.bsn{padding:8px 10px;font-size:11px;min-height:36px;display:flex;align-items:center}.bsn:active{background:var(--sf3)}.bsc{padding:2px 0 2px 10px}.lc{padding:5px 6px;font-size:10px;line-height:1.4}.cl-item{padding:8px 0}.cl-text{font-size:11px}.cl-meta{font-size:9px}.tstats{gap:6px}.tst{padding:4px 10px;font-size:10px}.sov .sbx{padding:20px;width:95%;max-width:none}.sov .sbx h2{font-size:14px}.sov .sbx input{font-size:16px;padding:12px;min-height:44px}.sov .sbx label{font-size:11px}.sov .sbx .brow{flex-direction:column;gap:8px}.sov .sbx button{padding:12px;min-height:44px;font-size:14px}}@media(max-width:380px){.hdr h1{font-size:1.3em}.ir input{font-size:14px;padding:12px}.ab{font-size:14px}.bnode{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}[data-theme="light"]{--bg:#f8f9fc;--sf:#ffffff;--sf2:#f0f1f5;--sf3:#e8e9ed;--bd:#d0d1dc;--tx:#1a1a2e;--tx2:#666680;--tx3:#999ab0;--ac:#6c5ce7;--ac2:#5a4bd1;--acg:rgba(108,92,231,.3);--pos:#00b894;--neg:#e17055;--neu:#6c5ce7;--info:#0984e3;--warn:#fdcb6e;--sh:0 8px 32px rgba(0,0,0,.08)}
[data-theme="light"] body::before{background:radial-gradient(ellipse at 20% 10%,rgba(108,92,231,.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(0,206,201,.03) 0%,transparent 50%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" media="print" onload="this.media='all'">
<script src="../config.js"></script>
</head>
<body>
<div class="ct">
  <div class="hdr" style="position:relative">
    <div class="hdr-btns">
      <button class="ib" onclick="toggleTheme()" title="다크/라이트 모드" id="themeBtn" style="font-size:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
      <button class="ib" onclick="toggleSettings()" title="API 설정">&#9881;</button>
    </div>
    <div class="hdr-badge"><span class="dot"></span>AI 기반 댓글 분석</div>
    <h1>댓글 분석기</h1>
    <p>YouTube 영상 링크를 붙여넣으면 AI가 댓글을 분석합니다</p>
  </div>
  <div class="is">
    <div class="ir">
      <input type="text" id="urlInput" placeholder="YouTube 영상 링크를 붙여넣으세요..." onkeydown="if(event.key==='Enter')doAnalyze()">
      <button class="ab" id="analyzeBtn" onclick="doAnalyze()">분석하기</button>
    </div>
    <p class="ah">설정에서 YouTube Data API 키 + OpenRouter API 키를 설정해주세요</p>
  </div>
  <div class="em" id="errorMsg"></div>
  <div class="ld" id="loading"><div class="sp"></div><p id="loadingText">분석을 시작합니다...</p><div class="pg"><div class="pb" id="progressBar"></div></div></div>
  <div id="resultArea"></div>
</div>
<div class="sov" id="settingsOverlay" onclick="if(event.target===this)toggleSettings()">
  <div class="sbx">
    <h2>API 설정</h2>
    <label>YouTube Data API 키</label>
    <input type="password" id="ytKeyInput" placeholder="AIzaSy..." autocomplete="off">
    <div class="hint">Google Cloud Console에서 발급</div>
    <label>OpenRouter API 키</label>
    <input type="password" id="oaiKeyInput" placeholder="sk-or-..." autocomplete="off">
    <div class="hint">openrouter.ai/keys에서 발급</div>
    <div id="ks"></div>
    <div class="brow"><button class="bcl" onclick="toggleSettings()">닫기</button><button class="bsv" onclick="saveSettings()">저장</button></div>
  </div>
</div>
<script>

// Theme
window.toggleTheme=function(){var d=document.documentElement;var c=d.getAttribute('data-theme');var next=c==='light'?'dark':'light';d.setAttribute('data-theme',next);document.getElementById('themeBtn').innerHTML=next==='dark'?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';localStorage.setItem('theme',next)}
(function(){var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').innerHTML=t==='dark'?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';}})();

(function(){
function toggleSettings(){var ov=document.getElementById('settingsOverlay');ov.classList.toggle('active');if(ov.classList.contains('active')){var yt=API_CONFIG.youtube;var oai=API_CONFIG.openrouter;var ks=document.getElementById('ks');var msgs=[];if(oai&&oai!=='YOUR_OPENROUTER_API_KEY_HERE')msgs.push('✅ OpenRouter: '+oai.substring(0,10)+'...');else msgs.push('⚠️ OpenRouter 미설정');if(yt)msgs.push('✅ YouTube: '+yt.substring(0,10)+'...');else msgs.push('⚠️ YouTube 미설정');ks.style.display='block';ks.style.background='rgba(108,92,231,.08)';ks.style.color='var(--ac2)';ks.style.border='1px solid rgba(108,92,231,.2)';ks.style.borderRadius='var(--rs)';ks.style.padding='8px 12px';ks.style.fontSize='12px';ks.textContent=msgs.join(' | ')}}
function showKS(m,t){var s=document.getElementById('ks');s.textContent=m;s.style.display='block';s.style.background=t==='ok'?'rgba(0,206,201,.08)':t==='err'?'rgba(255,107,107,.08)':'rgba(108,92,231,.08)';s.style.color=t==='ok'?'var(--pos)':t==='err'?'var(--neg)':'var(--ac2)';s.style.border='1px solid '+(t==='ok'?'rgba(0,206,201,.2)':t==='err'?'rgba(255,107,107,.2)':'rgba(108,92,231,.2)');s.style.borderRadius='var(--rs)';s.style.padding='8px 10px';s.style.fontSize='11px'}
function saveServerKeys(){showKS('config.js 파일을 GitHub에서 직접 편집하세요.\n\n1. GitHub.com 접속\n2. dimigo-tools/config.js 열기\n3. 값을 변경하고 저장','info')}
function checkKeyStatus(){var yt=API_CONFIG.youtube;var oai=API_CONFIG.openrouter;var ok=oai&&oai!=='YOUR_OPENROUTER_API_KEY_HERE';var yk=!!yt;showKS((ok?'✅':'⚠️')+' OpenRouter '+(ok?'설정됨':'미설정')+' | '+(yk?'✅':'⚠️')+' YouTube '+(yk?'설정됨':'미설정'),ok?'ok':'err')}
window.toggleSettings=toggleSettings;window.saveServerKeys=saveServerKeys;window.checkKeyStatus=checkKeyStatus;
function showError(m){var e=document.getElementById('errorMsg');e.textContent=m;e.classList.add('active')}
function hideError(){document.getElementById('errorMsg').classList.remove('active')}
function showLd(s){document.getElementById('loading').classList.toggle('active',s)}
function updateLd(t,p){if(t)document.getElementById('loadingText').textContent=t;if(p!==undefined)document.getElementById('progressBar').style.width=p+'%'}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function extractVideoId(url){if(!url)return null;try{var u=new URL(url.indexOf('?')>-1?url:'https://'+url);var v=u.searchParams.get('v');if(v&&v.length===11)return v;var segs=u.pathname.split('/').filter(Boolean);if(segs.length>0&&segs[segs.length-1].length===11)return segs[segs.length-1]}catch(e){}return null}

async function fetchVideoInfo(videoId){
  var key=API_CONFIG.youtube;
  if(!key)return null;
  try{
    var res=await fetch('https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id='+videoId+'&key='+key);
    if(!res.ok){var e=await res.json().catch(function(){return{}});console.log('YT video err:',res.status,e);return null}
    var data=await res.json();
    if(!data.items||!data.items.length)return null;
    var s=data.items[0].snippet,st=data.items[0].statistics;
    return{title:s.title,channel:s.channelTitle,viewCount:parseInt(st.viewCount)||0,likeCount:parseInt(st.likeCount)||0,commentCount:parseInt(st.commentCount)||0,thumbnail:s.thumbnails.high?s.thumbnails.high.url:'',description:(s.description||'').substring(0,600)}
  }catch(e){console.log('fetchVideoInfo error:',e);return null}
}

async function fetchComments(videoId){
  var key=API_CONFIG.youtube;
  if(!key)return[];
  var all=[],pageToken='',page=0;
  while(all.length<150&&page<8){
    var url='https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId='+videoId+'&key='+key+'&maxResults=100&order=relevance&textFormat=plainText';
    if(pageToken)url+='&pageToken='+encodeURIComponent(pageToken);
    try{
      var res=await fetch(url);
      if(!res.ok){var err=await res.json().catch(function(){return{}});console.log('Comment API err:',res.status,err);break}
      var data=await res.json();
      if(!data.items||data.items.length===0)break;
      for(var i=0;i<data.items.length;i++){
        var sn=data.items[i].snippet.topLevelComment.snippet;
        all.push({author:sn.authorDisplayName,text:sn.textDisplay.replace(/<[^>]*>/g,''),likes:sn.likeCount||0,date:sn.publishedAt?sn.publishedAt.substring(0,10):''});
      }
      if(!data.nextPageToken)break;
      pageToken=data.nextPageToken;page++;
      updateLd('댓글 수집 중... ('+all.length+'개)',20+page*8);
    }catch(e){console.log('fetchComments error:',e);break}
  }
  return all;
}

async function analyzeWithAI(videoInfo,url,comments){
  var key=API_CONFIG.openrouter;
  if(!key)throw new Error('OpenRouter API 키가 없습니다. 설정에서 입력해주세요.');
  var hasReal=comments&&comments.length>0;
  var ctx='';
  if(videoInfo){
    ctx='영상 제목: '+videoInfo.title+'\n채널: '+videoInfo.channel+'\n조회수: '+videoInfo.viewCount.toLocaleString()+'\n좋아요: '+videoInfo.likeCount.toLocaleString()+'\n댓글 수: '+videoInfo.commentCount.toLocaleString();
    if(videoInfo.description)ctx+='\n설명: '+videoInfo.description.substring(0,500);
  }else{
    ctx='YouTube 영상 URL: '+url;
  }
  var commentSection='';
  if(hasReal){
    commentSection='\n\n아래는 YouTube에서 실제로 수집한 '+comments.length+'개의 댓글입니다:\n\n'+comments.map(function(c,i){return'['+(i+1)+'] '+c.author+' ('+c.likes+'좋아요, '+c.date+') '+c.text}).join('\n');
  }
  var rule=hasReal?
    '위 댓글들은 YouTube에서 실제로 수집한 실제 댓글입니다. 아래 규칙을 반드시 지키세요:\n1. categories[].subCategories[].comments 배열에는 위 댓글 원문을 그대로 복사하세요\n2. 절대 댓글을 만들거나 수정하지 마세요\n3. 원문에 없는 내용을 추가하지 마세요\n4. 댓글이 길면 앞 100자만 잘라도 됩니다 (그 외에는 그대로)':
    '댓글을 수집할 수 없었습니다. 영상 정보를 바탕으로 예상되는 댓글 유형을 보여주세요.';
  var prompt='YouTube 댓글 분석 전문가입니다.\n\n'+ctx+commentSection+'\n\n'+rule+'\n\n아래 JSON 형식으로만 응답하세요:\n{"categories":[{"name":"카테고리명","type":"positive","summary":"한줄요약","subCategories":[{"name":"세부분류","comments":["댓글원문1","댓글원문2"]}]}],"totalAnalyzed":0,"overallSummary":"전체요약","videoInsight":"영상분석"}';
  var res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-4o-mini',messages:[{role:'system',content:'YouTube 댓글 분석 전문가. JSON으로만 응답. 한국어. 실제 댓글 원문을 그대로 복사하여 분류하세요. 댓글을 만들지 마세요.'},{role:'user',content:prompt}],temperature:0.15,max_tokens:4000})});
  if(!res.ok){var err=await res.json().catch(function(){return{}});throw new Error(err&&err.error?err.error.message:'API 오류 ('+res.status+')')}
  var data=await res.json();
  var content=data.choices[0].message.content;
  var m=content.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('AI 응답에서 JSON을 찾을 수 없습니다.');
  return JSON.parse(m[0]);
}

function dotC(t){if(!t)return'var(--neu)';if(t==='positive')return'var(--pos)';if(t==='negative')return'var(--neg)';if(t==='question')return'var(--info)';if(t==='suggestion')return'var(--warn)';return'var(--neu)'}
function emo(t){if(!t)return'\ud83d\ude10';if(t==='positive')return'\ud83d\ude0a';if(t==='negative')return'\ud83d\ude20';if(t==='question')return'\u2753';if(t==='suggestion')return'\ud83d\udca1';return'\ud83d\ude10'}

function renderTree(videoInfo,analysis,commentCount){
  var h='<div class="tree"><div class="troot">';
  if(videoInfo&&videoInfo.thumbnail)h+='<img src="'+esc(videoInfo.thumbnail)+'">';
  h+='<div class="rt">'+esc(videoInfo?videoInfo.title:'YouTube 영상')+'</div>';
  if(videoInfo&&videoInfo.channel)h+='<div class="rch">'+esc(videoInfo.channel)+'</div>';
  h+='<div class="rs">';
  if(videoInfo)h+='<span>\ud83d\udc41 <span class="n">'+(videoInfo.viewCount||0).toLocaleString()+'</span></span>';
  if(videoInfo)h+='<span>\ud83d\udc4d <span class="n">'+(videoInfo.likeCount||0).toLocaleString()+'</span></span>';
  h+='<span>\ud83d\udcac <span class="n">'+commentCount+'</span>개 분석</span></div>';
  if(analysis.overallSummary)h+='<div class="rsum">'+esc(analysis.overallSummary)+'</div>';
  if(analysis.videoInsight)h+='<div class="rins">\ud83e\udd16 '+esc(analysis.videoInsight)+'</div>';
  h+='</div><div class="ttrunk"></div><div class="tbranches">';
  analysis.categories.forEach(function(cat,ci){
    var dc=dotC(cat.type);var em=emo(cat.type);
    var cnt=0;if(cat.subCategories)cat.subCategories.forEach(function(s){if(s.comments)cnt+=s.comments.length});
    h+='<div class="tbranch"><div class="bstem" style="background:'+dc+'"></div>';
    h+='<div class="bnode" id="bn'+ci+'" onclick="toggleBr('+ci+')">';
    h+='<div class="bdot" style="background:'+dc+';color:'+dc+'"></div>';
    h+='<span class="bname">'+em+' '+esc(cat.name)+'</span><span class="bcnt">'+cnt+'개</span>';
    if(cat.summary)h+='<div class="bsum">'+esc(cat.summary)+'</div>';
    h+='<div class="barr">&#9660;</div></div>';
    h+='<div class="bleaves" id="bl'+ci+'">';
    if(cat.subCategories){cat.subCategories.forEach(function(sub,si){
      h+='<div class="bsub"><div class="bsn" onclick="toggleSub('+ci+','+si+')">'+esc(sub.name)+'<span class="sa">&#9654;</span></div>';
      h+='<div class="bsc" id="bs'+ci+'_'+si+'">';
      if(sub.comments)sub.comments.forEach(function(c){h+='<div class="lc"><span class="la">\ud83c\udf3f</span> '+esc(c)+'</div>'});
      h+='</div></div>';
    })}
    h+='</div></div>';
  });
  h+='</div>';
  h+='<div class="tstats"><div class="tst">\ud83c\udfaf <span class="n">'+analysis.categories.length+'</span>개 카테고리</div>';
  var tc=0;analysis.categories.forEach(function(c){if(c.subCategories)c.subCategories.forEach(function(s){if(s.comments)tc+=s.comments.length})});
  h+='<div class="tst">\ud83c\udf3f <span class="n">'+tc+'</span>개 댓글 분류</div></div></div>';
  return h;
}

function renderComments(comments){
  if(!comments||comments.length===0)return'';
  var h='<div class="cl"><div class="cl-title">\ud83d\udcac 수집된 실제 댓글 ('+comments.length+'개)</div>';
  comments.slice(0,50).forEach(function(c,i){
    h+='<div class="cl-item"><span class="cl-idx">#'+(i+1)+'</span><div><div class="cl-text">'+esc(c.text)+'</div><div class="cl-meta">'+esc(c.author)+' · '+esc(c.date)+' · \ud83d\udc4d '+c.likes+'</div></div></div>';
  });
  if(comments.length>50)h+='<div style="text-align:center;padding:8px;font-size:11px;color:var(--tx3)">... 외 '+(comments.length-50)+'개</div>';
  h+='</div>';return h;
}

window.toggleBr=function(ci){var n=document.getElementById('bn'+ci);var l=document.getElementById('bl'+ci);if(n)n.classList.toggle('open');if(l)l.classList.toggle('open')};
window.toggleSub=function(ci,si){var el=document.getElementById('bs'+ci+'_'+si);var nm=el?el.previousElementSibling:null;if(el)el.classList.toggle('open');if(nm)nm.classList.toggle('open')};

window.doAnalyze=async function(){
  hideError();
  var url=document.getElementById('urlInput').value.trim();
  if(!url){showError('YouTube 링크를 입력해주세요.');return}
  var videoId=extractVideoId(url);
  if(!videoId){showError('올바른 YouTube 링크를 입력해주세요.');return}
  var ytKey=API_CONFIG.youtube;
  var oaiKey=API_CONFIG.openrouter;
  if(!ytKey){showError('YouTube Data API 키가 필요합니다. 설정에서 입력해주세요.');return}
  if(!oaiKey){showError('OpenRouter API 키가 필요합니다. 설정에서 입력해주세요.');return}
  var btn=document.getElementById('analyzeBtn');btn.disabled=true;btn.textContent='분석 중...';
  document.getElementById('resultArea').innerHTML='';
  try{
    showLd(true);updateLd('영상 정보 불러오는 중...',10);
    var videoInfo=await fetchVideoInfo(videoId);
    updateLd('댓글 수집 중...',25);
    var comments=await fetchComments(videoId);
    console.log('수집된 댓글 수:',comments.length);
    if(comments.length===0){updateLd('댓글 수집 실패 - 영상 정보로 분석합니다',40)}
    else{updateLd('AI가 '+comments.length+'개 실제 댓글을 분석 중...',50)}
    var analysis=await analyzeWithAI(videoInfo,url,comments);
    analysis.totalAnalyzed=comments.length>0?comments.length:0;
    updateLd('완료!',95);
    await new Promise(function(r){setTimeout(r,200)});
    var html=renderTree(videoInfo,analysis,analysis.totalAnalyzed);
    html+=renderComments(comments);
    document.getElementById('resultArea').innerHTML=html;
    showLd(false);
  }catch(e){showLd(false);showError(e.message||'알 수 없는 오류')}
  finally{btn.disabled=false;btn.textContent='분석하기'}
};
})();
</script>
